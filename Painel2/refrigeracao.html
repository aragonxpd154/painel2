<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenção de Refrigeração — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18; --bg-1:#0f172a; --line:#232f4b;
    --green:#2ecc55; --red:#e5384b; --amber:#f5c451; --gray:#8b95ab; --white:#f3f3f3;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:15px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:all .15s ease;
    background:var(--bg-1);cursor:pointer;
  }
  .btn:hover{color:var(--white);border-color:var(--gray);}
  .btn-primary{
    font-family:var(--mono);font-size:12px;color:#062712;background:var(--green);border:none;
    border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:700;
  }

  .content{max-width:1000px;margin:0 auto;padding:24px 26px 60px;}
  .loading{padding:60px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}
  .page-intro{font-size:12.5px;color:var(--gray);line-height:1.7;margin:0 0 20px;}

  .loc-card{border:1px solid var(--line);border-radius:10px;background:var(--bg-1);margin-bottom:16px;overflow:hidden;}
  .loc-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .loc-head-main{flex:1;min-width:200px;}
  .loc-name{font-size:15px;font-weight:700;color:var(--white);background:none;border:none;
    outline:none;width:100%;font-family:var(--sans);padding:2px 0;}
  .loc-name:focus{border-bottom:1px solid var(--green);}
  .loc-model{font-size:11.5px;color:var(--amber);background:none;border:none;outline:none;
    width:100%;font-family:var(--mono);margin-top:3px;padding:2px 0;line-height:1.5;resize:none;}
  .loc-model:focus{border-bottom:1px solid var(--green);}
  .loc-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:6px;color:var(--gray);
    cursor:pointer;padding:5px 8px;font-size:12px;
  }
  .icon-btn:hover{color:var(--white);border-color:var(--gray);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}

  .events-list{padding:10px 18px 14px;}
  .event-row{
    display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #18233a;
  }
  .event-row:last-child{border-bottom:none;}
  .event-date{
    width:110px;flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--amber);
    background:none;border:none;outline:none;padding:3px 0;
  }
  .event-date:focus{border-bottom:1px solid var(--green);}
  .event-sep{color:var(--line);font-size:12px;flex-shrink:0;padding-top:3px;}
  .event-text{
    flex:1;font-size:12.5px;color:var(--white);background:none;border:none;outline:none;
    resize:none;font-family:var(--sans);line-height:1.5;padding:3px 0;
  }
  .event-text:focus{border-bottom:1px solid var(--green);}
  .event-del{background:none;border:none;color:var(--gray);cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
  .event-del:hover{color:var(--red);}
  .no-events{color:var(--gray);font-size:11.5px;font-style:italic;padding:8px 0;}
  .add-event-btn{
    font-family:var(--mono);font-size:11px;color:var(--green);background:none;border:1px dashed var(--line);
    border-radius:6px;padding:6px 10px;cursor:pointer;margin-top:6px;
  }
  .add-event-btn:hover{border-color:var(--green);}

  .add-loc-bar{display:flex;justify-content:center;margin:20px 0 36px;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="topbar">
  <h1>Manutenção de Refrigeração</h1>
  <div class="topbar-right">
    <a class="btn" href="/nobreak">&#128267; Nobreak</a>
    <a class="btn" href="/graficos-historico">&#128200; gráficos histórico</a>
    <a class="btn" href="/relatorios-sites">&#128203; Relatórios Sites</a>
    <a class="btn" href="/logs">&#128220; relatórios</a>
    <a class="btn" href="/config">&#9881; config</a>
    <a class="btn" href="/">&larr; mapa</a>
    <a class="btn" href="/logout">&#128274; sair</a>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">carregando...</div>
</div>

<script>
let refrigData = {locations: []};

async function loadRefrig(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">carregando...</div>';
  try{
    const res = await fetch('/api/refrigeracao', {cache:'no-store'});
    if(!res.ok) throw new Error('status ' + res.status);
    refrigData = await res.json();
    render();
  }catch(err){
    content.innerHTML = '<div class="loading">erro ao carregar: ' + err.message + '</div>';
  }
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML = '';

  const intro = document.createElement('p');
  intro.className = 'page-intro';
  intro.textContent = 'Histórico de manutenção dos aparelhos de refrigeração por localidade. Clique em qualquer texto pra editar, ou use "+ novo evento" pra registrar uma preventiva, corretiva, troca de equipamento, ou outra ocorrência futura.';
  content.appendChild(intro);

  refrigData.locations.forEach(loc => {
    content.appendChild(buildLocationCard(loc));
  });

  const addBar = document.createElement('div');
  addBar.className = 'add-loc-bar';
  addBar.innerHTML = '<button class="btn-primary" id="add-loc-btn">+ Nova Localidade</button>';
  content.appendChild(addBar);
  addBar.querySelector('#add-loc-btn').addEventListener('click', addLocation);

  // o autoGrow feito durante a montagem dos elementos (antes de entrarem
  // na pagina) nao calcula altura certa - refaz agora que tudo esta
  // realmente visivel no documento, corrigindo campos que ficavam
  // encolhidos/invisiveis (modelo, qtd/btus, texto dos eventos).
  content.querySelectorAll('textarea').forEach(ta => autoGrow(ta));
}

function buildLocationCard(loc){
  const card = document.createElement('div');
  card.className = 'loc-card';

  const head = document.createElement('div');
  head.className = 'loc-head';
  head.innerHTML = `
    <div class="loc-head-main">
      <input class="loc-name" value="${escapeAttr(loc.local)}" placeholder="Nome da localidade">
      <textarea class="loc-model" rows="1" placeholder="Qtd/Btus/modelo dos aparelhos">${escapeHtml(loc.qtd_btus)}</textarea>
    </div>
    <div class="loc-actions">
      <button class="icon-btn danger" title="Excluir localidade">&#128465;</button>
    </div>`;
  const nameInput = head.querySelector('.loc-name');
  const modelInput = head.querySelector('.loc-model');
  autoGrow(modelInput);
  modelInput.addEventListener('input', () => autoGrow(modelInput));
  nameInput.addEventListener('change', () => saveLocation(loc.id, nameInput.value, modelInput.value));
  modelInput.addEventListener('change', () => saveLocation(loc.id, nameInput.value, modelInput.value));
  head.querySelector('.icon-btn.danger').addEventListener('click', () => deleteLocation(loc.id));
  card.appendChild(head);

  const list = document.createElement('div');
  list.className = 'events-list';
  if(!loc.eventos.length){
    list.innerHTML = '<div class="no-events">nenhum evento registrado ainda</div>';
  }
  loc.eventos.forEach(ev => {
    list.appendChild(buildEventRow(loc.id, ev));
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-event-btn';
  addBtn.textContent = '+ novo evento';
  addBtn.addEventListener('click', () => addEvent(loc.id));
  list.appendChild(addBtn);
  card.appendChild(list);

  return card;
}

function buildEventRow(locationId, ev){
  const row = document.createElement('div');
  row.className = 'event-row';
  row.innerHTML = `
    <input class="event-date" data-event-id="${ev.id}" value="${escapeAttr(ev.data)}" placeholder="dd/mm/aaaa">
    <span class="event-sep">—</span>
    <textarea class="event-text" rows="1" placeholder="descreva o que aconteceu...">${escapeHtml(ev.texto)}</textarea>
    <button class="event-del" title="Excluir evento">&times;</button>`;
  const dateInput = row.querySelector('.event-date');
  const textInput = row.querySelector('.event-text');
  autoGrow(textInput);
  textInput.addEventListener('input', () => autoGrow(textInput));
  dateInput.addEventListener('change', () => saveEvent(locationId, ev.id, dateInput.value, textInput.value));
  textInput.addEventListener('change', () => saveEvent(locationId, ev.id, dateInput.value, textInput.value));
  row.querySelector('.event-del').addEventListener('click', () => deleteEvent(locationId, ev.id));
  return row;
}

function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function escapeAttr(s){
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ---------------- acoes: localidades ----------------
async function addLocation(){
  await postJSON('/api/refrigeracao/location', {action:'add', local:'Novo local', qtd_btus:''});
  loadRefrig();
}
async function saveLocation(id, local, qtd_btus){
  await postJSON('/api/refrigeracao/location', {action:'edit', id, local, qtd_btus});
}
async function deleteLocation(id){
  if(!confirm('Excluir esta localidade e todo o histórico dela?')) return;
  await postJSON('/api/refrigeracao/location', {action:'delete', id});
  loadRefrig();
}

// ---------------- acoes: eventos ----------------
async function addEvent(location_id){
  const result = await postJSON('/api/refrigeracao/event', {action:'add', location_id, data:'', texto:''});
  await loadRefrig();
  if(result && result.new_id) focusNewEvent(result.new_id);
}
function focusNewEvent(eventId){
  const row = document.querySelector(`.event-date[data-event-id="${eventId}"]`);
  if(row){
    if(typeof row.scrollIntoView === 'function') row.scrollIntoView({behavior:'smooth', block:'center'});
    row.focus();
  }
}
async function saveEvent(location_id, id, data, texto){
  await postJSON('/api/refrigeracao/event', {action:'edit', location_id, id, data, texto});
}
async function deleteEvent(location_id, id){
  await postJSON('/api/refrigeracao/event', {action:'delete', location_id, id});
  loadRefrig();
}

async function postJSON(url, body){
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'falha ao salvar');
    return data;
  }catch(err){
    alert('Erro ao salvar: ' + err.message);
    throw err;
  }
}

loadRefrig();
</script>
</body>
</html>
