<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18;
    --bg-1:#0f172a;
    --line:#232f4b;
    --green:#2ecc55;
    --red:#e5384b;
    --amber:#f5c451;
    --gray:#8b95ab;
    --white:#f3f3f3;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:15px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;align-items:center;}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:all .15s ease;
    background:var(--bg-1);cursor:pointer;
  }
  .btn:hover{color:var(--white);border-color:var(--gray);}

  .toolbar{
    display:flex;gap:10px;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .toolbar input, .toolbar select{
    background:var(--bg-1);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;color:var(--white);font-size:13px;font-family:var(--sans);
  }
  .toolbar input{flex:1;min-width:200px;}
  .toolbar input::placeholder{color:var(--gray);}
  .count{font-family:var(--mono);font-size:12px;color:var(--gray);white-space:nowrap;}

  .content{max-width:1080px;margin:0 auto;padding:16px 26px 60px;}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);
    padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:112px;background:var(--bg);
  }
  tbody td{padding:9px 10px;border-bottom:1px solid #151e34;vertical-align:top;}
  tbody tr:hover{background:var(--bg-1);}
  .ts{color:var(--gray);white-space:nowrap;}
  .tag{
    display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;white-space:nowrap;
  }
  .tag-up{background:rgba(46,204,85,0.15);color:var(--green);}
  .tag-down{background:rgba(229,56,75,0.15);color:var(--red);}
  .tag-alarme{background:rgba(229,56,75,0.15);color:var(--red);}
  .tag-ok{background:rgba(46,204,85,0.15);color:var(--green);}
  .tag-ativado{background:rgba(46,204,85,0.15);color:var(--green);}
  .tag-desativado{background:rgba(138,138,138,0.2);color:var(--gray);}
  .tag-default{background:rgba(245,196,81,0.15);color:var(--amber);}
  .device-cell{font-weight:600;}
  .detail-cell{color:var(--gray);}
  .ip-cell{color:var(--amber);}

  .empty{padding:50px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="topbar">
  <h1>Log de Eventos — últimos 1000</h1>
  <div class="topbar-right">
    <a class="btn" href="/eventos.log" download>&#8681; baixar .log</a>
    <a class="btn" href="/relatorio">&#128203; relatório mensal</a>
    <a class="btn" href="/relatorio-anual">&#128197; relatório anual</a>
    <a class="btn" href="/nobreak">&#128267; nobreak</a>
    <a class="btn" href="/refrigeracao">&#10052; refrigeração</a>
    <a class="btn" href="/graficos-historico">&#128200; gráficos histórico</a>
    <a class="btn" href="/relatorios-sites">&#128203; relatórios sites</a>
    <a class="btn" href="/config">&#9881; config</a>
    <a class="btn" href="/" id="back-to-map-link">&larr; mapa</a>
    <a class="btn" href="/logout">&#128274; sair</a>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search-input" placeholder="Buscar por dispositivo, IP ou tipo...">
  <select id="type-filter">
    <option value="">todos os tipos</option>
    <option value="PING">ping (up/down)</option>
    <option value="ALARME">alarme</option>
    <option value="OK">ok (recuperado)</option>
    <option value="ATIVADO">ativado</option>
    <option value="DESATIVADO">desativado</option>
  </select>
  <span class="count" id="count-label">carregando...</span>
</div>

<div class="content">
  <table>
    <thead>
      <tr><th>Quando</th><th>Tipo</th><th>Dispositivo</th><th>Detalhe</th><th>IP</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none;">nenhum evento encontrado</div>
</div>

<script>
let EVENTS = [];

function tagClass(type){
  const t = type.toLowerCase();
  if(t.includes('up') || t.includes('ok') || t.includes('ativado') && !t.includes('des')) return 'tag-ok';
  if(t.includes('down') || t.includes('alarme')) return 'tag-alarme';
  if(t === 'ativado') return 'tag-ativado';
  if(t === 'desativado') return 'tag-desativado';
  return 'tag-default';
}

function fmtTime(ts){
  const d = new Date(ts*1000);
  return d.toLocaleString('pt-BR');
}

function render(){
  const q = (document.getElementById('search-input').value||'').trim().toLowerCase();
  const typeFilter = document.getElementById('type-filter').value;
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty-msg');

  const filtered = EVENTS.filter(ev => {
    if(typeFilter && !ev.type.startsWith(typeFilter)) return false;
    if(!q) return true;
    return ev.device.toLowerCase().includes(q) ||
           (ev.ip||'').includes(q) ||
           ev.type.toLowerCase().includes(q) ||
           (ev.detail||'').toLowerCase().includes(q);
  });

  document.getElementById('count-label').textContent = filtered.length + ' de ' + EVENTS.length + ' eventos';

  if(filtered.length === 0){
    rowsEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  rowsEl.innerHTML = filtered.map(ev => `
    <tr>
      <td class="ts">${fmtTime(ev.ts)}</td>
      <td><span class="tag ${tagClass(ev.type)}">${ev.type}</span></td>
      <td class="device-cell">${ev.device}</td>
      <td class="detail-cell">${ev.detail || '—'}</td>
      <td class="ip-cell">${ev.ip || '—'}</td>
    </tr>
  `).join('');
}

async function loadEvents(){
  try{
    const res = await fetch('/api/events', {cache:'no-store'});
    const data = await res.json();
    EVENTS = data.events || [];
    render();
  }catch(err){
    document.getElementById('count-label').textContent = 'erro ao carregar eventos';
  }
}

document.getElementById('search-input').addEventListener('input', render);
document.getElementById('type-filter').addEventListener('change', render);

(function fixBackLink(){
  const lastMap = localStorage.getItem('painel_last_map');
  const link = document.getElementById('back-to-map-link');
  if(!link) return;
  if(lastMap === 'fg') link.href = '/mapa-fg';
  else if(lastMap === 'interior') link.href = '/mapa-interior';
  else link.href = '/selecionar';
})();

loadEvents();
setInterval(loadEvents, 15000);
</script>
</body>
</html>
