<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lixeira — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18; --bg-1:#0f172a; --line:#232f4b;
    --green:#2ecc55; --red:#e5384b; --amber:#f5c451; --gray:#8b95ab; --white:#f3f3f3;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:15px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:all .15s ease;
    background:var(--bg-1);cursor:pointer;
  }
  .btn:hover{color:var(--white);border-color:var(--gray);}
  .btn-danger{color:#2a0a0a;background:var(--red);border:none;font-weight:700;}

  .content{max-width:960px;margin:0 auto;padding:24px 26px 60px;}
  .loading{padding:60px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}
  .page-intro{font-size:12.5px;color:var(--gray);line-height:1.7;margin:0 0 16px;}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:20px;
  }
  .toolbar .count{font-size:13px;color:var(--white);}
  .toolbar .count b{font-family:var(--mono);color:var(--amber);}
  .filter-select{
    background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--white);
    padding:7px 10px;font-family:var(--sans);font-size:12.5px;outline:none;cursor:pointer;max-width:280px;
  }
  .filter-select:focus{border-color:var(--green);}

  .trash-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg-1);
    padding:14px 18px;margin-bottom:10px;flex-wrap:wrap;
  }
  .trash-info{flex:1;min-width:220px;}
  .trash-tipo{
    font-family:var(--mono);font-size:9.5px;color:var(--amber);text-transform:uppercase;
    letter-spacing:.03em;margin-bottom:4px;
  }
  .trash-desc{font-size:13.5px;color:var(--white);font-weight:600;line-height:1.4;}
  .trash-when{font-size:11px;color:var(--gray);margin-top:4px;}
  .trash-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:6px;color:var(--gray);
    cursor:pointer;padding:6px 10px;font-size:11.5px;font-family:var(--mono);white-space:nowrap;
  }
  .icon-btn:hover{color:var(--white);border-color:var(--gray);}
  .icon-btn.restore{color:var(--green);}
  .icon-btn.restore:hover{border-color:var(--green);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}
  .icon-btn:disabled{opacity:.5;cursor:default;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--gray);font-size:13px;
  }
  .empty-state .big{font-size:32px;margin-bottom:10px;}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="topbar">
  <h1>Lixeira</h1>
  <div class="topbar-right">
    <a class="btn" href="/relatorios-sites">&#128203; relatórios sites</a>
    <a class="btn" href="/inventario">&#128230; inventário</a>
    <a class="btn" href="/nobreak">&#128267; Nobreak</a>
    <a class="btn" href="/refrigeracao">&#10052; Refrigeração</a>
    <a class="btn" href="/logs">&#128220; relatórios</a>
    <a class="btn" href="/">&larr; mapa</a>
    <a class="btn" href="/logout">&#128274; sair</a>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">carregando...</div>
</div>

<script>
let lixeiraItems = [];
let tipoLabels = {};
let filtroTipo = '';

async function loadLixeira(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">carregando...</div>';
  try{
    const res = await fetch('/api/lixeira', {cache:'no-store'});
    if(!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    lixeiraItems = data.items || [];
    tipoLabels = data.tipo_labels || {};
    render();
  }catch(err){
    content.innerHTML = '<div class="loading">erro ao carregar: ' + err.message + '</div>';
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function formatWhen(ts){
  if(!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML = '';

  const intro = document.createElement('p');
  intro.className = 'page-intro';
  intro.textContent = 'Tudo que foi excluído em qualquer página do sistema (Relatórios Sites, Inventário, Nobreak, Refrigeração, ocorrências manuais) fica aqui, podendo ser restaurado a qualquer momento.';
  content.appendChild(intro);

  const tiposPresentes = [...new Set(lixeiraItems.map(i => i.tipo))];

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <div class="count">${lixeiraItems.length} <b>${lixeiraItems.length === 1 ? 'item' : 'itens'}</b> na lixeira</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      ${tiposPresentes.length > 1 ? `
        <select class="filter-select" id="filtro-tipo">
          <option value="">Todos os tipos</option>
          ${tiposPresentes.map(t => `<option value="${t}" ${filtroTipo === t ? 'selected' : ''}>${escapeHtml(tipoLabels[t] || t)}</option>`).join('')}
        </select>
      ` : ''}
      ${lixeiraItems.length ? '<button class="btn-danger" id="esvaziar-btn">Esvaziar lixeira</button>' : ''}
    </div>
  `;
  content.appendChild(toolbar);
  const filtroSelect = toolbar.querySelector('#filtro-tipo');
  if(filtroSelect) filtroSelect.addEventListener('change', (e) => { filtroTipo = e.target.value; render(); });
  const esvaziarBtn = toolbar.querySelector('#esvaziar-btn');
  if(esvaziarBtn) esvaziarBtn.addEventListener('click', esvaziarLixeira);

  const visiveis = filtroTipo ? lixeiraItems.filter(i => i.tipo === filtroTipo) : lixeiraItems;

  if(!visiveis.length){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<div class="big">&#128465;</div>${lixeiraItems.length ? 'nenhum item desse tipo' : 'a lixeira está vazia'}`;
    content.appendChild(empty);
    return;
  }

  visiveis.forEach(item => content.appendChild(buildTrashItem(item)));
}

function buildTrashItem(item){
  const el = document.createElement('div');
  el.className = 'trash-item';
  el.innerHTML = `
    <div class="trash-info">
      <div class="trash-tipo">${escapeHtml(tipoLabels[item.tipo] || item.tipo)}</div>
      <div class="trash-desc">${escapeHtml(item.descricao || '(sem descrição)')}</div>
      <div class="trash-when">Excluído em ${formatWhen(item.excluido_em)}</div>
    </div>
    <div class="trash-actions">
      <button class="icon-btn restore" title="Restaurar">&#8634; Restaurar</button>
      <button class="icon-btn danger" title="Excluir definitivamente">&#128465; Excluir definitivo</button>
    </div>
  `;
  el.querySelector('.icon-btn.restore').addEventListener('click', (e) => restaurarItem(item.id, e.currentTarget));
  el.querySelector('.icon-btn.danger').addEventListener('click', (e) => excluirDefinitivo(item.id, e.currentTarget));
  return el;
}

async function restaurarItem(id, btn){
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Restaurando...';
  try{
    const res = await fetch('/api/lixeira/restaurar', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'falha ao restaurar');
    loadLixeira();
  }catch(err){
    alert('Não foi possível restaurar: ' + err.message);
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function excluirDefinitivo(id, btn){
  if(!confirm('Excluir este item definitivamente? Essa ação NÃO pode ser desfeita.')) return;
  btn.disabled = true;
  try{
    const res = await fetch('/api/lixeira/excluir-definitivo', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'falha ao excluir');
    loadLixeira();
  }catch(err){
    alert('Erro: ' + err.message);
    btn.disabled = false;
  }
}

async function esvaziarLixeira(){
  if(!confirm(`Esvaziar a lixeira inteira (${lixeiraItems.length} ${lixeiraItems.length === 1 ? 'item' : 'itens'})? Essa ação NÃO pode ser desfeita e nenhum item poderá ser restaurado depois.`)) return;
  try{
    const res = await fetch('/api/lixeira/esvaziar', {method: 'POST'});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'falha ao esvaziar');
    loadLixeira();
  }catch(err){
    alert('Erro: ' + err.message);
  }
}

loadLixeira();
</script>
</body>
</html>
