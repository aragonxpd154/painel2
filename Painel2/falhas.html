<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Falhas — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18;
    --bg-1:#0f172a;
    --bg-2:#191919;
    --line:#232f4b;
    --green:#2ecc55;
    --red:#e5384b;
    --amber:#f5c451;
    --gray:#8b95ab;
    --white:#f3f3f3;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:30;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:15px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:all .15s ease;
    background:var(--bg-1);cursor:pointer;
  }
  .btn:hover{color:var(--white);border-color:var(--gray);}
  .btn.active{color:var(--white);border-color:var(--amber);}

  .summary-bar{
    display:flex;gap:14px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line);
  }
  .summary-card{
    background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:140px;
  }
  .summary-card .n{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1;}
  .summary-card .n.bad{color:var(--red);}
  .summary-card .n.ok{color:var(--green);}
  .summary-card .l{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;font-family:var(--mono);}

  .content{max-width:1180px;margin:0 auto;padding:20px 26px 60px;}

  .city-group{
    background:var(--bg-1);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;
  }
  .city-head{
    display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
    cursor:pointer;user-select:none;background:var(--bg-2);
  }
  .city-head:hover{background:#1f1f1f;}
  .city-head .city-name{font-size:14.5px;font-weight:700;letter-spacing:.02em;}
  .city-head .city-stats{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--gray);}
  .city-head .city-stats b{color:var(--red);}
  .city-head .chevron{transition:transform .2s ease;color:var(--gray);}
  .city-group.collapsed .chevron{transform:rotate(-90deg);}
  .city-group.collapsed .city-body{display:none;}

  .city-body{padding:6px 14px 14px;}

  .device-block{margin-top:10px;}
  .device-block-head{
    display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
    background:var(--bg-2);border-radius:8px;font-size:13px;font-weight:600;
  }
  .device-block-head .d-stats{font-family:var(--mono);font-size:11px;color:var(--gray);font-weight:400;}
  .device-block-head .d-stats b{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:4px;}
  thead th{
    text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);
    padding:6px 10px;
  }
  tbody td{padding:7px 10px;border-top:1px solid #18233a;}
  .reason-cell{color:#ddd;}
  .dur-cell{color:var(--amber);white-space:nowrap;}
  .dur-cell.ongoing{color:var(--red);font-weight:700;}
  .ts-cell{color:var(--gray);white-space:nowrap;}

  .empty{padding:60px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}
  .loading{padding:60px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="topbar">
  <h1>Dashboard de Falhas — Rede Gazeta</h1>
  <div class="topbar-right">
    <button class="btn" data-days="7">7 dias</button>
    <button class="btn active" data-days="30">30 dias</button>
    <button class="btn" data-days="90">90 dias</button>
    <a class="btn" href="/logs">&#128220; logs</a>
    <a class="btn" href="/config">&#9881; config</a>
    <a class="btn" href="/" id="back-to-map-link">&larr; mapa</a>
    <a class="btn" href="/logout">&#128274; sair</a>
  </div>
</div>

<div class="summary-bar" id="summary-bar">
  <div class="summary-card"><div class="n bad" id="s-total">–</div><div class="l">Falhas no período</div></div>
  <div class="summary-card"><div class="n" id="s-downtime">–</div><div class="l">Tempo total parado</div></div>
  <div class="summary-card"><div class="n" id="s-cities">–</div><div class="l">Cidades afetadas</div></div>
  <div class="summary-card"><div class="n bad" id="s-ongoing">–</div><div class="l">Falhas em andamento</div></div>
  <div class="summary-card"><div class="n" id="s-worst">–</div><div class="l">Cidade com mais falhas</div></div>
</div>

<div class="content" id="content">
  <div class="loading">carregando dados de falhas...</div>
</div>

<script>
let currentDays = 30;

function fmtDuration(seconds){
  if(seconds < 60) return Math.round(seconds) + 's';
  const mins = Math.floor(seconds/60);
  if(mins < 60) return mins + 'min';
  const hours = Math.floor(mins/60);
  const remMins = mins % 60;
  if(hours < 24) return hours + 'h' + (remMins ? remMins+'min' : '');
  const days = Math.floor(hours/24);
  const remHours = hours % 24;
  return days + 'd' + (remHours ? ' '+remHours+'h' : '');
}

function fmtDate(ts){
  return new Date(ts*1000).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

async function loadDashboard(){
  document.getElementById('content').innerHTML = '<div class="loading">carregando dados de falhas...</div>';
  try{
    const res = await fetch('/api/incidents?days=' + currentDays, {cache:'no-store'});
    const data = await res.json();
    render(data.incidents || []);
  }catch(err){
    document.getElementById('content').innerHTML = '<div class="empty">erro ao carregar: sem conexão com o backend</div>';
  }
}

function render(incidents){
  const content = document.getElementById('content');

  if(incidents.length === 0){
    content.innerHTML = '<div class="empty">nenhuma falha registrada nesse período &#127881;</div>';
    document.getElementById('s-total').textContent = '0';
    document.getElementById('s-downtime').textContent = '0min';
    document.getElementById('s-cities').textContent = '0';
    document.getElementById('s-ongoing').textContent = '0';
    document.getElementById('s-worst').textContent = '—';
    return;
  }

  // agrupar por cidade -> dispositivo -> lista de incidentes
  const bySite = {};
  let totalDowntime = 0;
  let ongoingCount = 0;

  incidents.forEach(inc => {
    const site = inc.site || 'Sem site';
    bySite[site] = bySite[site] || {};
    const devKey = inc.device_name;
    bySite[site][devKey] = bySite[site][devKey] || [];
    bySite[site][devKey].push(inc);
    totalDowntime += inc.duration_s;
    if(inc.ongoing) ongoingCount++;
  });

  const siteNames = Object.keys(bySite);
  const siteFailCounts = siteNames.map(s => {
    let c = 0;
    Object.values(bySite[s]).forEach(list => c += list.length);
    return {site: s, count: c};
  }).sort((a,b) => b.count - a.count);

  document.getElementById('s-total').textContent = incidents.length;
  document.getElementById('s-downtime').textContent = fmtDuration(totalDowntime);
  document.getElementById('s-cities').textContent = siteNames.length;
  document.getElementById('s-ongoing').textContent = ongoingCount;
  document.getElementById('s-worst').textContent = siteFailCounts[0] ? siteFailCounts[0].site : '—';

  let html = '';
  siteFailCounts.forEach(({site, count}) => {
    const devices = bySite[site];
    let siteDowntime = 0;
    Object.values(devices).forEach(list => list.forEach(i => siteDowntime += i.duration_s));

    html += `<div class="city-group">
      <div class="city-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <div class="city-name">${site}</div>
        <div class="city-stats">
          <span><b>${count}</b> falhas</span>
          <span>${fmtDuration(siteDowntime)} parado</span>
          <span class="chevron">&#9660;</span>
        </div>
      </div>
      <div class="city-body">`;

    const deviceNames = Object.keys(devices).sort((a,b) => devices[b].length - devices[a].length);
    deviceNames.forEach(devName => {
      const list = devices[devName].sort((a,b) => b.start_ts - a.start_ts);
      let devDowntime = 0;
      list.forEach(i => devDowntime += i.duration_s);

      html += `<div class="device-block">
        <div class="device-block-head">
          <span>${devName} <span style="color:var(--gray);font-weight:400;">(${devices[devName][0].ip || 'sem IP'})</span></span>
          <span class="d-stats"><b>${list.length}</b> falha${list.length>1?'s':''} · ${fmtDuration(devDowntime)} parado</span>
        </div>
        <table>
          <thead><tr><th>Início</th><th>Motivo</th><th>Duração</th></tr></thead>
          <tbody>`;
      list.forEach(inc => {
        html += `<tr>
          <td class="ts-cell">${fmtDate(inc.start_ts)}</td>
          <td class="reason-cell">${inc.reason}</td>
          <td class="dur-cell ${inc.ongoing ? 'ongoing' : ''}">${inc.ongoing ? 'em andamento (' + fmtDuration(inc.duration_s) + ')' : fmtDuration(inc.duration_s)}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

document.querySelectorAll('.btn[data-days]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-days]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDays = parseInt(btn.dataset.days, 10);
    loadDashboard();
  });
});

(function fixBackLink(){
  const lastMap = localStorage.getItem('painel_last_map');
  const link = document.getElementById('back-to-map-link');
  if(!link) return;
  if(lastMap === 'fg') link.href = '/mapa-fg';
  else if(lastMap === 'interior') link.href = '/mapa-interior';
  else link.href = '/selecionar';
})();

loadDashboard();
setInterval(loadDashboard, 60000);
</script>
</body>
</html>
