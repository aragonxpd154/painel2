<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climatização Fonte Grande — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18; --bg-1:#0e1628; --bg-2:#121d36; --line:#223050;
    --green:#2ecc55; --red:#e5384b; --amber:#f5c451; --cyan:#39c6e8; --gray:#8b95ab; --white:#eef2fa;
    --mono:'Manrope','Segoe UI',sans-serif; --sans:'Manrope','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--white);font-family:var(--sans);}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:10px 26px;background:rgba(7,12,24,0.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .topbar h1{margin:0;font-size:17px;font-weight:700;}
  .topbar .sub{font-size:12px;color:var(--gray);margin-top:2px;display:flex;align-items:center;gap:7px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#434f6c;display:inline-block;}
  .dot.up{background:var(--green);box-shadow:0 0 6px var(--green);} .dot.down{background:var(--red);box-shadow:0 0 6px var(--red);}
  .spacer{flex:1;}
  .nav{display:flex;gap:8px;flex-wrap:wrap;}
  .nav a{font-size:12.5px;color:var(--gray);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;}
  .nav a:hover{color:var(--white);border-color:var(--gray);}
  .clock{font-size:13px;color:var(--gray);text-align:right;line-height:1.3;}
  .clock b{color:var(--white);font-size:15px;}
  main{padding:22px 26px 60px;max-width:1700px;margin:0 auto;}
  .section-head{display:flex;align-items:baseline;gap:14px;margin:6px 0 14px;}
  .section-head h2{margin:0;font-size:15px;font-weight:800;}
  .section-head .hint{font-size:12px;color:var(--gray);}
  section{margin-bottom:30px;}

  /* temperaturas principais */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .kpi{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .k{font-size:12px;color:var(--gray);font-weight:600;}
  .kpi .v{font-size:40px;font-weight:800;line-height:1.1;margin-top:6px;}
  .kpi .v small{font-size:16px;color:var(--gray);font-weight:600;margin-left:4px;}
  .kpi .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--cyan);transition:width .6s ease;}
  .kpi.hot .v{color:#ff8f9a;} .kpi.hot .bar{background:var(--red);}
  .kpi.warm .v{color:var(--amber);} .kpi.warm .bar{background:var(--amber);}
  .kpi.main{background:linear-gradient(135deg,#0a2a5c,#0e1628);border-color:#1d4a9a;}
  .facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .fact{background:var(--bg-2);border:1px solid #1f2d4d;border-radius:10px;padding:8px 14px;font-size:12.5px;color:#b8c3dc;}
  .fact b{color:#fff;font-size:15px;margin-left:6px;}

  /* sondas */
  .sondas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .sonda{background:var(--bg-1);border:1px solid var(--line);border-left:5px solid #434f6c;border-radius:12px;padding:12px 14px;}
  .sonda.ok{border-left-color:var(--green);} .sonda.fail{border-left-color:var(--red);background:#1f0d17;}
  .sonda .t{font-size:12px;color:var(--gray);}
  .sonda .v{font-size:26px;font-weight:800;margin:4px 0 2px;}
  .sonda .s{font-size:11.5px;font-weight:700;}
  .sonda.ok .s{color:#6fe38e;} .sonda.fail .s{color:#ff8f9a;}

  /* splits */
  .splits{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;}
  .split{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-top:4px solid #434f6c;}
  .split.on{border-top-color:var(--green);} .split.alarm{border-top-color:var(--red);}
  .split-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
  .split-name{font-size:18px;font-weight:800;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;background:#15203a;color:#9aa6c0;border:1px solid #26365a;}
  .chip.on{background:rgba(46,204,85,0.13);color:#6fe38e;border-color:rgba(46,204,85,0.45);}
  .chip.warn{background:rgba(245,196,81,0.13);color:var(--amber);border-color:rgba(245,196,81,0.45);}
  .chip.off{background:rgba(229,56,75,0.12);color:#ff8f9a;border-color:rgba(229,56,75,0.4);}
  .units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .unit{background:var(--bg-2);border:1px solid #1f2d4d;border-radius:10px;padding:10px 12px;text-align:center;}
  .unit .n{font-size:12px;color:var(--gray);font-weight:700;letter-spacing:.03em;}
  .fan{width:38px;height:38px;margin:8px auto 6px;display:block;color:#3a4767;}
  .unit.run .fan{color:var(--cyan);animation:spin 1.6s linear infinite;}
  .unit.fail .fan{color:var(--red);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .unit .st{font-size:12px;font-weight:700;}
  .unit.run .st{color:#6fe38e;} .unit.fail .st{color:#ff8f9a;}
  .unit .h{font-size:11px;color:var(--gray);margin-top:3px;}
  .split-foot{margin-top:10px;font-size:12px;color:var(--gray);}
  .split-foot b{color:#dbe3f5;}

  .others{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:6px 16px;columns:2 360px;column-gap:30px;}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;border-bottom:1px solid #172340;break-inside:avoid;}
  .kv span{color:#b8c3dc;} .kv b{font-weight:700;white-space:nowrap;}
  .empty{color:var(--gray);font-size:13px;padding:20px;border:1px dashed var(--line);border-radius:12px;}
  .note{font-size:11.5px;color:var(--gray);margin-top:8px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand-badge gz"><img src="/static/img/logo-gazeta-azul.png" alt="Rede Gazeta"></div>
  <div>
    <h1>Climatização Fonte Grande</h1>
    <div class="sub"><span class="dot" id="conn-dot"></span><span id="conn-label">conectando...</span></div>
  </div>
  <div class="spacer"></div>
  <div class="nav">
    <a href="/mapa-fg">Abrigo Fonte Grande</a>
    <a href="/energia">Energia Fonte Grande</a>
    <a href="/refrigeracao">Manutenção ar-condicionado</a>
    <a href="/graficos-historico">Gráficos</a>
    <a href="/selecionar">Mapas</a>
  </div>
  <div class="clock"><b id="clock">--:--:--</b><br><span id="clock-date"></span></div>
</div>

<main id="main"><div class="empty">carregando...</div></main>

<script>
const POLL_MS = 5000;
let CLPS = [];
let STATUS = {};
const FAN = '<svg class="fan" viewBox="0 0 24 24" fill="currentColor"><path d="M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm.5-9c4.5 0 4.6 3.6 2.2 4.8-1 .5-1.4 1.4-1.6 2.3.5.2.9.5 1.2.9 3.7-2 7.7-1.1 7.7 2.5 0 4.5-3.6 4.6-4.8 2.2-.5-1-1.4-1.4-2.3-1.6-.2.5-.5.9-.9 1.2 2 3.7 1.1 7.7-2.5 7.7-4.5 0-4.6-3.6-2.2-4.8 1-.5 1.4-1.4 1.6-2.3-.5-.2-.9-.5-1.2-.9-3.7 2-7.7 1.1-7.7-2.5 0-4.5 3.6-4.6 4.8-2.2.5 1 1.4 1.4 2.3 1.6.2-.5.5-.9.9-1.2-2-3.7-1.1-7.7 2.5-7.7z"/></svg>';

function esc(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function tick(){ const n = new Date(); document.getElementById('clock').textContent = n.toLocaleTimeString('pt-BR');
  document.getElementById('clock-date').textContent = n.toLocaleDateString('pt-BR'); }
setInterval(tick, 1000); tick();

async function loadDevices(){
  const r = await fetch('/api/devices-fg', {cache:'no-store'});
  if(r.status === 401){ location.href = '/login'; return; }
  const d = await r.json();
  // CLP de climatizacao = dispositivo com medidas "SplitN - ..." ou "Temperatura Balanceada"
  CLPS = (d.devices || []).filter(dev => (dev.metrics || []).some(m => /^Split\s*\d|Temperatura Balanceada/i.test(m.label)));
}
async function pollStatus(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    if(r.status === 401){ location.href = '/login'; return; }
    STATUS = (await r.json()).devices || {};
    document.getElementById('conn-dot').className = 'dot up';
    document.getElementById('conn-label').textContent = 'ao vivo — atualizado ' + new Date().toLocaleTimeString('pt-BR');
  }catch(e){
    document.getElementById('conn-dot').className = 'dot down';
    document.getElementById('conn-label').textContent = 'sem conexão com o servidor';
  }
  render();
}

function getter(dev){
  const st = STATUS[dev.id] || {};
  const metrics = (dev.metrics || []).filter(m => m.enabled !== false);
  const find = re => metrics.find(m => re.test(m.label));
  const e = m => (m && st.metrics) ? st.metrics[m.label] : null;
  const num = m => { const x = e(m); if(!x || x.value == null) return null;
    const n = (x.scaled != null) ? x.scaled : parseFloat(x.value); return isNaN(n) ? null : n; };
  const bool = m => { const n = num(m); return n == null ? null : n !== 0; };
  return {st, metrics, find, e, num, bool};
}
const fmt = (n, d) => n == null ? '—' : n.toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});

function tempClass(t){ if(t == null) return ''; if(t >= 30) return 'hot'; if(t >= 26) return 'warm'; return ''; }

function renderClp(dev){
  const g = getter(dev);
  const used = new Set();
  const take = m => { if(m) used.add(m.label); return m; };
  let html = '';

  // ---- temperaturas balanceadas ----
  const tGeral = take(g.find(/balanceada - geral/i)), tTx = take(g.find(/balanceada - transmiss/i)), tUps = take(g.find(/balanceada - ups/i));
  const kpi = (label, m, main) => { const v = g.num(m); const pct = v == null ? 0 : Math.max(4, Math.min(100, v / 40 * 100));
    return '<div class="kpi ' + (main ? 'main ' : '') + tempClass(v) + '"><div class="k">' + label + '</div><div class="v">' + fmt(v, 1) +
      '<small>' + esc((m && m.unit) || '°C') + '</small></div><div class="bar" style="width:' + pct + '%"></div></div>'; };
  const setp = take(g.find(/^setpoint.*leitura/i)), hist = take(g.find(/^delta histerese.*leitura/i));
  const comp = take(g.find(/compressores ativos/i)), evap = take(g.find(/evaporadoras ativos/i)), evapReq = take(g.find(/evaporadoras requeridas.*leitura/i));
  const facts = [['Setpoint', setp], ['Histerese', hist], ['Compressores ativos', comp], ['Evaporadoras ativas', evap], ['Evaporadoras requeridas', evapReq]]
    .filter(x => x[1]).map(x => '<div class="fact">' + x[0] + '<b>' + esc((g.e(x[1]) && g.e(x[1]).display) || '—') + '</b></div>').join('');
  html += '<section><div class="section-head"><h2>' + esc(dev.name) + '</h2><span class="hint">' + esc(dev.ip || '') +
          (dev.modbus ? ' · Slave ID ' + dev.modbus.unit_id : '') + (g.st.reachable === false ? ' · <span style="color:#ff8f9a">sem comunicação</span>' : '') + '</span></div>' +
          '<div class="kpis">' + kpi('Temperatura geral', tGeral, true) + kpi('Sala de transmissão', tTx) + kpi('Sala de UPS', tUps) + '</div>' +
          (facts ? '<div class="facts">' + facts + '</div>' : '') + '</section>';

  // ---- sondas ----
  const sondas = {};
  g.metrics.forEach(m => { const k = m.label.match(/^Sonda\s*(\d+)/i); if(!k) return;
    sondas[k[1]] = sondas[k[1]] || {}; if(/problema|falha/i.test(m.label)) sondas[k[1]].prob = take(m); else if(/temperatura/i.test(m.label)) sondas[k[1]].temp = take(m); });
  const sondaKeys = Object.keys(sondas).sort((a, b) => a - b);
  if(sondaKeys.length){
    html += '<section><div class="section-head"><h2>Sondas de temperatura</h2></div><div class="sondas">' + sondaKeys.map(k => {
      const s = sondas[k]; const fail = g.bool(s.prob); const t = g.num(s.temp);
      const local = s.temp ? s.temp.label.replace(/^Sonda\s*\d+\s*-\s*Temperatura\s*-\s*/i, '') : '';
      return '<div class="sonda ' + (fail === true ? 'fail' : (fail === false ? 'ok' : '')) + '"><div class="t">Sonda ' + k + (local ? ' · ' + esc(local) : '') + '</div>' +
        '<div class="v">' + fmt(t, 1) + ' <small style="font-size:13px;color:var(--gray)">' + esc((s.temp && s.temp.unit) || '°C') + '</small></div>' +
        '<div class="s">' + (fail === true ? 'SONDA COM PROBLEMA' : (fail === false ? 'sonda OK' : '—')) + '</div></div>';
    }).join('') + '</div></section>';
  }

  // ---- splits ----
  const splits = {};
  g.metrics.forEach(m => { const k = m.label.match(/^Split\s*(\d+)\s*-\s*(.+)$/i); if(!k) return;
    splits[k[1]] = splits[k[1]] || []; splits[k[1]].push(take(m)); });
  const splitKeys = Object.keys(splits).sort((a, b) => a - b);
  if(splitKeys.length){
    html += '<section><div class="section-head"><h2>Splits</h2><span class="hint">condensadoras (Cond1, Cond2) e evaporadora de cada split</span></div><div class="splits">' +
      splitKeys.map(k => {
        const f = re => splits[k].find(m => re.test(m.label));
        const on = g.bool(f(/-\s*on$/i)), auto = g.bool(f(/-\s*auto$/i));
        const req = f(/quantidade requerida/i);
        const unit = name => {
          const run = g.bool(f(new RegExp('-\\s*' + name + '\\s*-\\s*status', 'i')));
          const ok = g.bool(f(new RegExp('-\\s*' + name + '\\s*-\\s*health', 'i')));
          const hrs = g.num(f(new RegExp('-\\s*' + name + '\\s*-\\s*horas', 'i')));
          const cls = ok === false ? 'fail' : (run ? 'run' : '');
          const stt = ok === false ? 'FALHA' : (run === null ? '—' : (run ? 'ligada' : 'parada'));
          return '<div class="unit ' + cls + '"><div class="n">' + name.toUpperCase().replace('EVAP', 'EVAPORADORA') + '</div>' + FAN +
            '<div class="st">' + stt + '</div><div class="h">' + (hrs == null ? '' : fmt(hrs, 0) + ' h trabalhadas') + '</div></div>';
        };
        const anyFail = splits[k].some(m => /health/i.test(m.label) && g.bool(m) === false);
        const chips = (on === null ? '' : (on ? '<span class="chip on">Ligado</span>' : '<span class="chip">Desligado</span>')) +
          (auto === null ? '' : (auto ? '<span class="chip on">Automático</span>' : '<span class="chip warn">Manual</span>')) +
          (anyFail ? '<span class="chip off">Falha</span>' : '');
        return '<div class="split ' + (anyFail ? 'alarm' : (on ? 'on' : '')) + '"><div class="split-head"><span class="split-name">Split ' + k + '</span><span class="chips">' + chips + '</span></div>' +
          '<div class="units">' + unit('Cond1') + unit('Cond2') + unit('Evap') + '</div>' +
          (req ? '<div class="split-foot">Quantidade requerida: <b>' + esc((g.e(req) && g.e(req).display) || '—') + '</b></div>' : '') + '</div>';
      }).join('') + '</div></section>';
  }

  // ---- demais medidas ----
  const rest = g.metrics.filter(m => !used.has(m.label));
  if(rest.length){
    html += '<section><div class="section-head"><h2>Outras medidas</h2></div><div class="others">' + rest.map(m => {
      const x = g.e(m); return '<div class="kv"><span>' + esc(m.label) + '</span><b>' + esc(x && x.display != null ? x.display : '—') + '</b></div>'; }).join('') + '</div></section>';
  }
  return html;
}

function render(){
  const main = document.getElementById('main');
  if(!CLPS.length){
    main.innerHTML = '<div class="empty">Nenhum CLP de climatização encontrado no Abrigo Fonte Grande.</div>';
    return;
  }
  main.innerHTML = CLPS.map(renderClp).join('') +
    '<div class="note">Temperaturas fora da faixa? Ajuste o divisor da medida em Config → Editor de Mapa (o CLP costuma enviar em décimos ou centésimos de °C).</div>';
}

(async function init(){
  try{ await loadDevices(); }catch(e){}
  pollStatus();
  setInterval(pollStatus, POLL_MS);
})();
</script>
<link rel="stylesheet" href="/static/theme.css">
</body>
</html>
