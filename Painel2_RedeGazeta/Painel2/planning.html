<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning — Rede Gazeta</title>
<style>
  :root{
    --bg:#070c18; --bg-1:#0f172a; --line:#232f4b;
    --green:#2ecc55; --red:#e5384b; --amber:#f5c451; --gray:#8b95ab; --white:#f3f3f3;
    --blue:#5b8def;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:15px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:all .15s ease;
    background:var(--bg-1);cursor:pointer;
  }
  .btn:hover{color:var(--white);border-color:var(--gray);}
  .btn-primary{
    font-family:var(--mono);font-size:12px;color:#062712;background:var(--green);border:none;
    border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;
  }
  .btn-danger{color:#2a0a0a;background:var(--red);border:none;font-weight:700;}

  .content{max-width:1400px;margin:0 auto;padding:24px 26px 60px;display:grid;grid-template-columns:1fr 320px;gap:22px;}
  @media (max-width:1000px){.content{grid-template-columns:1fr;}}
  .loading{padding:60px;text-align:center;color:var(--gray);font-family:var(--mono);font-size:13px;}

  .summary-bar{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;grid-column:1/-1;
  }
  .summary-chip{
    background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:10px 18px;
    display:flex;align-items:center;gap:10px;flex:1;min-width:140px;
  }
  .summary-chip .v{font-family:var(--mono);font-size:20px;font-weight:800;}
  .summary-chip .l{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.03em;}
  .summary-chip.atrasadas .v{color:var(--red);}
  .summary-chip.pendentes .v{color:var(--amber);}
  .summary-chip.concluidas .v{color:var(--green);}

  .calendar-panel{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .cal-title{font-size:17px;font-weight:700;text-transform:capitalize;}
  .cal-nav{display:flex;gap:8px;align-items:center;}
  .cal-nav button{
    font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--white);padding:7px 12px;cursor:pointer;font-size:13px;
  }
  .cal-nav button:hover{border-color:var(--gray);}

  .legend{display:flex;gap:14px;margin-bottom:14px;font-size:11px;color:var(--gray);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend .dot{width:9px;height:9px;border-radius:50%;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:var(--mono);font-size:10.5px;color:var(--gray);text-transform:uppercase;text-align:center;padding-bottom:6px;}
  .cal-day{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:96px;
    cursor:pointer;transition:border-color .15s ease;display:flex;flex-direction:column;gap:3px;
  }
  .cal-day:hover{border-color:var(--gray);}
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day.today{border-color:var(--blue);border-width:2px;}
  .cal-day .daynum{font-family:var(--mono);font-size:12px;color:var(--gray);}
  .cal-day.today .daynum{color:var(--blue);font-weight:700;}
  .cal-day .chip{
    font-size:10px;padding:2px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:#070c18;font-weight:600;
  }
  .cal-day .chip.done{opacity:.5;text-decoration:line-through;}
  .cal-day .more{font-size:9.5px;color:var(--gray);padding-left:4px;}

  .upcoming-panel{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:18px;height:fit-content;}
  .upcoming-panel h2{margin:0 0 14px;font-size:13px;font-weight:700;}
  .upcoming-item{
    display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #18233a;cursor:pointer;
  }
  .upcoming-item:last-child{border-bottom:none;}
  .upcoming-item:hover .upcoming-titulo{color:var(--blue);}
  .upcoming-prio-bar{width:4px;border-radius:2px;flex-shrink:0;}
  .upcoming-date{font-family:var(--mono);font-size:10px;color:var(--gray);white-space:nowrap;}
  .upcoming-date.atrasada{color:var(--red);font-weight:700;}
  .upcoming-titulo{font-size:12.5px;font-weight:600;margin-top:2px;}
  .upcoming-meta{font-size:10.5px;color:var(--gray);margin-top:2px;}
  .empty-state{color:var(--gray);font-size:12px;font-style:italic;padding:14px 0;}

  .search-row{margin-bottom:14px;}
  .search-row input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--white);
    padding:8px 10px;font-family:var(--sans);font-size:12.5px;outline:none;
  }
  .search-row input:focus{border-color:var(--green);}

  /* modal do dia (lista de atividades daquele dia + adicionar) */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:22px;
    max-width:560px;width:100%;max-height:88vh;overflow-y:auto;margin:auto;
  }
  .modal-box h3{margin:0 0 4px;font-size:15px;}
  .modal-box .modal-sub{font-size:11.5px;color:var(--gray);margin-bottom:16px;text-transform:capitalize;}

  .day-activity-item{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;
    border-left:4px solid var(--gray);
  }
  .day-activity-item.prio-baixa{border-left-color:var(--green);}
  .day-activity-item.prio-media{border-left-color:var(--amber);}
  .day-activity-item.prio-alta{border-left-color:var(--red);}
  .day-activity-item .dai-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .day-activity-item .dai-titulo{font-size:13.5px;font-weight:700;}
  .day-activity-item.done .dai-titulo{opacity:.5;text-decoration:line-through;}
  .day-activity-item .dai-meta{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.6;}
  .day-activity-item .dai-desc{font-size:11.5px;color:var(--white);margin-top:6px;white-space:pre-wrap;}
  .day-activity-item .dai-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:6px;color:var(--gray);cursor:pointer;
    padding:4px 8px;font-size:11px;
  }
  .icon-btn:hover{color:var(--white);border-color:var(--gray);}
  .icon-btn.check.active{color:var(--green);border-color:var(--green);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field textarea, .field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--white);
    padding:8px 10px;font-family:var(--sans);font-size:13px;outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--green);}
  .field textarea{resize:vertical;min-height:55px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}

  .prio-toggle{display:flex;gap:8px;}
  .prio-btn{
    flex:1;text-align:center;padding:8px;border-radius:7px;border:1px solid var(--line);
    background:var(--bg);color:var(--gray);cursor:pointer;font-size:12px;font-weight:600;
  }
  .prio-btn.active-baixa{background:#0f2a16;border-color:var(--green);color:var(--green);}
  .prio-btn.active-media{background:#241a08;border-color:var(--amber);color:var(--amber);}
  .prio-btn.active-alta{background:#2a0a0a;border-color:var(--red);color:var(--red);}

  .modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;}
  .modal-actions-right{display:flex;gap:10px;}
  .fieldset-title{font-size:11.5px;color:var(--gray);text-transform:uppercase;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="topbar">
  <h1>Planning — Agenda de Atividades</h1>
  <div class="topbar-right">
    <a class="btn" href="/relatorios-sites">&#128203; Relatórios Sites</a>
    <a class="btn" href="/nobreak">&#128267; Nobreak</a>
    <a class="btn" href="/refrigeracao">&#10052;&#65039; Refrigeração</a>
    <a class="btn" href="/selecionar">&larr; Mapas</a>
    <a class="btn" href="/logout">&#128274; sair</a>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">carregando...</div>
</div>

<!-- ===================== modal do dia ===================== -->
<div class="modal-overlay" id="day-modal">
  <div class="modal-box">
    <h3>Atividades do dia</h3>
    <div class="modal-sub" id="day-modal-date"></div>
    <div id="day-activities-list"></div>
    <button class="btn-primary" id="add-activity-btn" style="width:100%;margin-top:6px;">+ Nova atividade</button>
    <div class="modal-actions">
      <button class="btn" id="day-modal-close">Fechar</button>
      <div></div>
    </div>
  </div>
</div>

<!-- ===================== modal de criar/editar atividade ===================== -->
<div class="modal-overlay" id="activity-modal">
  <div class="modal-box">
    <h3 id="activity-modal-title">Nova Atividade</h3>
    <div class="field">
      <label>Título</label>
      <input type="text" id="f-titulo" placeholder="Ex: Manutenção preventiva nobreak">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-data">
      </div>
      <div class="field">
        <label>Local</label>
        <input type="text" id="f-local" placeholder="Ex: Vitória FG">
      </div>
    </div>
    <div class="field">
      <label>Prioridade</label>
      <div class="prio-toggle">
        <div class="prio-btn" id="prio-baixa" data-val="baixa">Baixa</div>
        <div class="prio-btn" id="prio-media" data-val="media">Média</div>
        <div class="prio-btn" id="prio-alta" data-val="alta">Alta</div>
      </div>
    </div>
    <div class="field">
      <label>Responsável</label>
      <input type="text" id="f-responsavel" placeholder="Nome de quem vai executar">
    </div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <textarea id="f-descricao" placeholder="Detalhes da atividade..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="activity-modal-delete" style="display:none;">Excluir</button>
      <div class="modal-actions-right">
        <button class="btn" id="activity-modal-cancel">Cancelar</button>
        <button class="btn-primary" id="activity-modal-save">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
let allActivities = [];
let currentYear, currentMonth; // month: 0-11
let selectedDateStr = null; // "YYYY-MM-DD" do dia aberto no modal
let editingActivityId = null;
let searchTerm = '';

const PRIO_COLOR = {baixa: '#2ecc55', media: '#f5c451', alta: '#e5384b'};
const PRIO_LABEL = {baixa: 'Baixa', media: 'Média', alta: 'Alta'};
const DOW_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_LABELS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function formatDatePtBr(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function formatDateLong(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}

async function loadActivities(){
  const res = await fetch('/api/planning', {cache:'no-store'});
  const data = await res.json();
  allActivities = data.activities || [];
}

function activitiesOn(dateStr){
  return allActivities.filter(a => a.data === dateStr && matchesSearch(a));
}
function matchesSearch(a){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return (a.titulo||'').toLowerCase().includes(t) ||
         (a.responsavel||'').toLowerCase().includes(t) ||
         (a.local||'').toLowerCase().includes(t);
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML = '';

  content.appendChild(buildSummaryBar());
  content.appendChild(buildCalendarPanel());
  content.appendChild(buildUpcomingPanel());
}

function buildSummaryBar(){
  const el = document.createElement('div');
  el.className = 'summary-bar';
  const total = allActivities.length;
  const pendentes = allActivities.filter(a => a.status !== 'concluida').length;
  const concluidas = allActivities.filter(a => a.status === 'concluida').length;
  const hoje = todayStr();
  const atrasadas = allActivities.filter(a => a.status !== 'concluida' && a.data < hoje).length;

  el.innerHTML = `
    <div class="summary-chip"><div><div class="v">${total}</div><div class="l">Total</div></div></div>
    <div class="summary-chip pendentes"><div><div class="v">${pendentes}</div><div class="l">Pendentes</div></div></div>
    <div class="summary-chip concluidas"><div><div class="v">${concluidas}</div><div class="l">Concluídas</div></div></div>
    <div class="summary-chip atrasadas"><div><div class="v">${atrasadas}</div><div class="l">Atrasadas</div></div></div>
  `;
  return el;
}

function buildCalendarPanel(){
  const el = document.createElement('div');
  el.className = 'calendar-panel';

  const monthName = MONTH_LABELS[currentMonth] + ' ' + currentYear;
  el.innerHTML = `
    <div class="cal-header">
      <div class="cal-title">${monthName}</div>
      <div class="cal-nav">
        <button id="cal-prev">&larr;</button>
        <button id="cal-today">Hoje</button>
        <button id="cal-next">&rarr;</button>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:${PRIO_COLOR.alta};"></span>Alta</span>
      <span><span class="dot" style="background:${PRIO_COLOR.media};"></span>Média</span>
      <span><span class="dot" style="background:${PRIO_COLOR.baixa};"></span>Baixa</span>
    </div>
    <div class="search-row"><input type="text" id="search-input" placeholder="Buscar por título, local ou responsável..."></div>
    <div class="cal-grid" id="cal-grid"></div>
  `;

  el.querySelector('#cal-prev').addEventListener('click', () => { changeMonth(-1); });
  el.querySelector('#cal-next').addEventListener('click', () => { changeMonth(1); });
  el.querySelector('#cal-today').addEventListener('click', () => {
    const d = new Date();
    currentYear = d.getFullYear(); currentMonth = d.getMonth();
    render();
  });
  const searchInput = el.querySelector('#search-input');
  searchInput.value = searchTerm;
  searchInput.addEventListener('input', (e) => { searchTerm = e.target.value; renderCalendarGrid(el.querySelector('#cal-grid')); renderUpcomingList(); });

  setTimeout(() => renderCalendarGrid(el.querySelector('#cal-grid')), 0);
  return el;
}

function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  render();
}

function renderCalendarGrid(gridEl){
  gridEl.innerHTML = '';
  DOW_LABELS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    gridEl.appendChild(el);
  });

  const firstOfMonth = new Date(currentYear, currentMonth, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=domingo
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const hoje = todayStr();

  for(let i=0; i<startWeekday; i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    gridEl.appendChild(el);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = currentYear + '-' + String(currentMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-day' + (dateStr === hoje ? ' today' : '');
    dayEl.addEventListener('click', () => openDayModal(dateStr));

    const acts = activitiesOn(dateStr).sort((a,b) => ({alta:0,media:1,baixa:2}[a.prioridade] - {alta:0,media:1,baixa:2}[b.prioridade]));
    const maxShow = 3;
    let chipsHtml = acts.slice(0, maxShow).map(a => `
      <div class="chip ${a.status==='concluida'?'done':''}" style="background:${PRIO_COLOR[a.prioridade]};" title="${escapeHtml(a.titulo)}">${escapeHtml(a.titulo)}</div>
    `).join('');
    if(acts.length > maxShow){
      chipsHtml += `<div class="more">+${acts.length - maxShow} mais</div>`;
    }

    dayEl.innerHTML = `<div class="daynum">${day}</div>${chipsHtml}`;
    gridEl.appendChild(dayEl);
  }
}

function buildUpcomingPanel(){
  const el = document.createElement('div');
  el.className = 'upcoming-panel';
  el.innerHTML = `<h2>&#128197; Próximas Atividades</h2><div id="upcoming-list"></div>`;
  setTimeout(renderUpcomingList, 0);
  return el;
}

function renderUpcomingList(){
  const listEl = document.getElementById('upcoming-list');
  if(!listEl) return;
  const hoje = todayStr();
  const upcoming = allActivities
    .filter(a => a.status !== 'concluida' && matchesSearch(a))
    .sort((a,b) => a.data.localeCompare(b.data))
    .slice(0, 10);

  if(!upcoming.length){
    listEl.innerHTML = '<div class="empty-state">nenhuma atividade pendente</div>';
    return;
  }

  listEl.innerHTML = upcoming.map(a => {
    const atrasada = a.data < hoje;
    return `
      <div class="upcoming-item" data-date="${a.data}">
        <div class="upcoming-prio-bar" style="background:${PRIO_COLOR[a.prioridade]};"></div>
        <div style="flex:1;">
          <div class="upcoming-date ${atrasada?'atrasada':''}">${formatDatePtBr(a.data)}${atrasada?' — atrasada':''}</div>
          <div class="upcoming-titulo">${escapeHtml(a.titulo)}</div>
          <div class="upcoming-meta">${escapeHtml(a.local || '')}${a.local && a.responsavel ? ' · ' : ''}${escapeHtml(a.responsavel || '')}</div>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.upcoming-item').forEach(item => {
    item.addEventListener('click', () => openDayModal(item.dataset.date));
  });
}

// ===================== modal do dia =====================
const dayModal = document.getElementById('day-modal');
function openDayModal(dateStr){
  selectedDateStr = dateStr;
  document.getElementById('day-modal-date').textContent = formatDateLong(dateStr);
  renderDayActivitiesList();
  dayModal.classList.add('open');
}
function renderDayActivitiesList(){
  const listEl = document.getElementById('day-activities-list');
  const acts = activitiesOn(selectedDateStr);
  if(!acts.length){
    listEl.innerHTML = '<div class="empty-state">nenhuma atividade nesse dia ainda</div>';
    return;
  }
  listEl.innerHTML = acts.map(a => `
    <div class="day-activity-item prio-${a.prioridade} ${a.status==='concluida'?'done':''}" data-id="${a.id}">
      <div class="dai-top">
        <div>
          <div class="dai-titulo">${escapeHtml(a.titulo)}</div>
          <div class="dai-meta">
            ${PRIO_LABEL[a.prioridade]}${a.local ? ' · ' + escapeHtml(a.local) : ''}${a.responsavel ? ' · ' + escapeHtml(a.responsavel) : ''}
          </div>
          ${a.descricao ? '<div class="dai-desc">' + escapeHtml(a.descricao) + '</div>' : ''}
        </div>
        <div class="dai-actions">
          <button class="icon-btn check ${a.status==='concluida'?'active':''}" data-action="toggle" title="Marcar concluída">&#10003;</button>
          <button class="icon-btn" data-action="edit" title="Editar">&#9998;</button>
          <button class="icon-btn" data-action="delete" title="Excluir">&#128465;</button>
        </div>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('.day-activity-item').dataset.id;
      const a = allActivities.find(x => x.id === id);
      toggleActivityStatus(id, a.status === 'concluida' ? 'pendente' : 'concluida');
    });
  });
  listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('.day-activity-item').dataset.id;
      openActivityModal(allActivities.find(x => x.id === id));
    });
  });
  listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.closest('.day-activity-item').dataset.id;
      deleteActivity(id);
    });
  });
}
document.getElementById('day-modal-close').addEventListener('click', () => dayModal.classList.remove('open'));
document.getElementById('add-activity-btn').addEventListener('click', () => openActivityModal(null));

async function toggleActivityStatus(id, newStatus){
  try{
    await postJSON('/api/planning/activity', {action:'edit', id, status:newStatus});
    await refreshAll();
    renderDayActivitiesList();
  }catch(err){ alert('Erro: ' + err.message); }
}

async function deleteActivity(id){
  if(!confirm('Excluir esta atividade? Ela vai para a lixeira e pode ser restaurada depois.')) return;
  try{
    await postJSON('/api/planning/activity', {action:'delete', id});
    await refreshAll();
    renderDayActivitiesList();
  }catch(err){ alert('Erro: ' + err.message); }
}

// ===================== modal de criar/editar atividade =====================
const activityModal = document.getElementById('activity-modal');
function setPrioToggle(val){
  ['baixa','media','alta'].forEach(p => {
    document.getElementById('prio-'+p).classList.toggle('active-'+p, p === val);
  });
}
['baixa','media','alta'].forEach(p => {
  document.getElementById('prio-'+p).addEventListener('click', () => setPrioToggle(p));
});
function getPrioToggle(){
  for(const p of ['baixa','media','alta']){
    if(document.getElementById('prio-'+p).classList.contains('active-'+p)) return p;
  }
  return 'media';
}

function openActivityModal(activity){
  editingActivityId = activity ? activity.id : null;
  document.getElementById('activity-modal-title').textContent = activity ? 'Editar Atividade' : 'Nova Atividade';
  document.getElementById('f-titulo').value = activity ? activity.titulo : '';
  document.getElementById('f-data').value = activity ? activity.data : (selectedDateStr || todayStr());
  document.getElementById('f-local').value = activity ? (activity.local || '') : '';
  document.getElementById('f-responsavel').value = activity ? (activity.responsavel || '') : '';
  document.getElementById('f-descricao').value = activity ? (activity.descricao || '') : '';
  setPrioToggle(activity ? activity.prioridade : 'media');
  document.getElementById('activity-modal-delete').style.display = activity ? 'inline-block' : 'none';
  activityModal.classList.add('open');
}
document.getElementById('activity-modal-cancel').addEventListener('click', () => activityModal.classList.remove('open'));
document.getElementById('activity-modal-delete').addEventListener('click', async () => {
  if(!editingActivityId) return;
  activityModal.classList.remove('open');
  await deleteActivity(editingActivityId);
});

document.getElementById('activity-modal-save').addEventListener('click', async () => {
  const titulo = document.getElementById('f-titulo').value.trim();
  if(!titulo){ alert('Digite um título para a atividade.'); return; }
  const payload = {
    action: editingActivityId ? 'edit' : 'add',
    titulo,
    data: document.getElementById('f-data').value || todayStr(),
    local: document.getElementById('f-local').value,
    prioridade: getPrioToggle(),
    responsavel: document.getElementById('f-responsavel').value,
    descricao: document.getElementById('f-descricao').value,
  };
  if(editingActivityId) payload.id = editingActivityId;

  const btn = document.getElementById('activity-modal-save');
  btn.disabled = true;
  try{
    await postJSON('/api/planning/activity', payload);
    activityModal.classList.remove('open');
    await refreshAll();
    if(dayModal.classList.contains('open')) renderDayActivitiesList();
  }catch(err){
    alert('Erro ao salvar: ' + err.message);
  }finally{
    btn.disabled = false;
  }
});

async function postJSON(url, body){
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'falha na operação');
  return data;
}

async function refreshAll(){
  await loadActivities();
  render();
}

async function init(){
  const d = new Date();
  currentYear = d.getFullYear();
  currentMonth = d.getMonth();
  document.getElementById('content').innerHTML = '<div class="loading">carregando...</div>';
  try{
    await loadActivities();
    render();
  }catch(err){
    document.getElementById('content').innerHTML = '<div class="loading">erro ao carregar: ' + err.message + '</div>';
  }
}

init();
</script>
