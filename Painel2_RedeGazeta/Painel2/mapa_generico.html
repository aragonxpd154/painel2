<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa — Rede Gazeta</title>
<style>
  :root{
    --device-font-scale:1;
    --device-name-weight:700;
    --device-text-weight:600;
    --bg:#070c18;
    --bg-1:#0f172a;
    --line:#232f4b;
    --green:#2ecc55;
    --gray-d:#434f6c;
    --red:#e5384b;
    --gray:#8b95ab;
    --white:#f3f3f3;
    --amber:#f5c451;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',sans-serif;
  }
  html[data-theme="light"]{
    --bg:#eef0f3; --bg-1:#ffffff; --line:#d7dbe2; --green:#1ea34a; --gray-d:#c7cbd1;
    --red:#d1293b; --gray:#667085; --white:#12151c; --amber:#b9790f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--sans);}

  .topbar{
    display:flex;align-items:center;justify-content:flex-start;
    padding:7px 20px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;gap:26px;position:sticky;top:0;z-index:80;background:var(--bg);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{
    background:#fff;border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;
    align-items:center;line-height:1.05;box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .brand-badge .r1{color:#0b3d91;font-weight:700;font-size:12px;}
  .brand-badge .r2{color:#0b3d91;font-weight:700;font-size:10.5px;margin-top:0px;}
  .title-block h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--white);}
  .title-block .sub{font-family:var(--mono);font-size:10.5px;color:var(--gray);display:flex;align-items:center;gap:7px;margin-top:2px;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--gray-d);}
  .conn-dot.live{background:var(--green);box-shadow:0 0 6px 1px var(--green);}
  .conn-dot.down{background:var(--red);box-shadow:0 0 6px 1px var(--red);}

  .topbar-search{
    display:flex;align-items:center;gap:7px;
    background:#10182c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:190px;
  }
  .topbar-search input{background:none;border:none;outline:none;color:var(--white);font-size:12px;width:100%;font-family:var(--sans);}
  .topbar-search input::placeholder{color:var(--gray);}
  .topbar-search svg{width:12px;height:12px;stroke:var(--gray);fill:none;stroke-width:2;flex-shrink:0;}
  html[data-theme="light"] .topbar-search{background:#fff;}

  .stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .stat{text-align:right;font-family:var(--mono);}
  .stat .n{font-size:19px;font-weight:700;line-height:1;}
  .stat .n.ok{color:var(--green);} .stat .n.bad{color:var(--red);}
  .stat .l{font-size:9px;color:var(--gray);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .clock{font-family:var(--mono);font-size:11.5px;color:var(--gray);border-left:1px solid var(--line);padding-left:16px;line-height:1.3;}
  .clock-date{font-size:9.5px;color:var(--gray);opacity:.75;}
  .config-link{
    font-family:var(--mono);font-size:11.5px;color:var(--gray);text-decoration:none;
    border:1px solid var(--line);border-radius:7px;padding:6px 11px;transition:all .15s ease;white-space:nowrap;
  }
  .config-link:hover{color:var(--white);border-color:var(--gray);}
  button.config-link{background:none;cursor:pointer;font-family:var(--mono);}
  button.config-link.muted{color:var(--red);border-color:var(--red);}
  .config-link-stack{display:flex;flex-direction:column;gap:4px;}
  .config-link-stack .config-link{padding:4px 12px;}

  .zoom-controls{display:flex;gap:4px;border-left:1px solid var(--line);padding-left:14px;}
  .zoom-controls button{
    width:28px;height:28px;background:#111a2e;border:1px solid var(--line);border-radius:6px;
    color:var(--white);font-size:13px;cursor:pointer;
  }
  .zoom-controls button:hover{background:#1b2740;}
  html[data-theme="light"] .zoom-controls button{background:#fff;}

  .banner{
    display:none;background:rgba(229,56,75,0.1);border-bottom:1px solid rgba(229,56,75,0.4);
    color:#ff8f9a;font-family:var(--mono);font-size:11.5px;padding:7px 22px;
  }
  .banner.show{display:block;}

  .board-wrap{overflow:auto;height:calc(100vh - 58px);}
  .board{max-width:1600px;margin:0 auto;padding:22px;}
  .category{margin-bottom:22px;}
  .category-head{
    display:inline-block;background:linear-gradient(135deg,#1c3fae,#274bc9);color:#fff;
    font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    padding:7px 22px;border-radius:999px;margin-bottom:12px;
  }
  .category-grid{
    display:flex;flex-wrap:wrap;gap:10px;
    border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(255,255,255,0.015);
  }
  .device.dragging-active{opacity:.4;outline:2px dashed var(--amber);}

  .device{
    border-radius:6px;padding:7px 10px;text-align:center;cursor:pointer;
    font-family:var(--mono);font-size:calc(11px * var(--device-font-scale));line-height:1.4;font-weight:var(--device-text-weight);
    background:var(--gray-d);color:#0c1325;border:1px solid rgba(0,0,0,0.25);min-width:150px;
    transition:background .3s ease,transform .1s ease,box-shadow .3s ease;
    text-decoration:none;display:block;
  }
  .device:hover{transform:scale(1.035);box-shadow:0 4px 14px rgba(0,0,0,0.5);z-index:10;position:relative;}
  .device .dname{font-size:calc(11px * var(--device-font-scale));font-weight:var(--device-name-weight);color:#0c1a0c;}
  .device.st-up{background:var(--green);}
  .device.st-up .dname{color:#0a2b13;}
  .device.st-down{background:var(--red);}
  .device.st-down .dname{color:#3a0b10;}
  .device.st-unknown{background:var(--gray-d);}
  .device.st-unknown .dname{color:#e6e6e6;}
  .device.st-disabled{background:#162036;opacity:.55;border-style:dashed;}
  .device.st-disabled .dname{color:#888;}
  .device .metric-row{font-size:calc(10px * var(--device-font-scale));font-weight:var(--device-text-weight);opacity:.92;}
  .device .no-metrics{font-size:calc(9.5px * var(--device-font-scale));opacity:.7;font-style:italic;}
  .device .metric-alarm{color:#4a0a0e;font-weight:800;}
  .device .metric-error{opacity:.65;font-style:italic;}

  .empty-map{
    max-width:640px;margin:80px auto;text-align:center;color:var(--gray);font-family:var(--mono);
    font-size:13px;line-height:1.9;
  }
  .empty-map b{color:var(--white);}

  .history-panel{
    position:fixed;top:70px;right:22px;z-index:85;width:320px;
    background:rgba(10,16,32,0.92);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;backdrop-filter:blur(6px);
    resize:both;overflow:auto;min-width:260px;min-height:200px;max-width:90vw;max-height:85vh;
  }
  .history-head{cursor:move;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
  .history-head .h-name{font-size:13px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .history-head .h-close{font-family:var(--mono);font-size:11px;color:var(--gray);cursor:pointer;background:none;border:none;flex-shrink:0;}
  .history-head .h-close:hover{color:var(--white);}
  .history-ip{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-bottom:8px;}
  .history-select{
    width:100%;background:var(--bg-1);border:1px solid var(--line);border-radius:6px;
    color:var(--white);font-size:11.5px;font-family:var(--mono);padding:5px 7px;margin-bottom:10px;
  }
  .history-gauge-wrap{position:relative;height:0;overflow:hidden;transition:height .2s ease;}
  .history-gauge-wrap.show{height:96px;margin-bottom:6px;}
  .history-gauge-wrap svg{width:100%;height:100%;}
  .gauge-value-text{font-family:var(--mono);font-weight:700;}
  .gauge-unit-text{font-family:var(--mono);fill:var(--gray);}
  .gauge-label-text{font-family:var(--mono);fill:var(--gray);}
  .history-chart-wrap{position:relative;height:120px;}
  .history-chart-wrap svg{width:100%;height:100%;overflow:visible;}
  .history-line{fill:none;stroke:var(--green);stroke-width:1.6;}
  .history-area{fill:url(#historyGrad);opacity:.5;}
  .history-grid line{stroke:var(--line);stroke-width:1;}
  .history-axis-label{font-family:var(--mono);font-size:9px;fill:var(--gray);}
  .history-empty{
    height:120px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;color:var(--gray);text-align:center;padding:0 10px;
  }
  .history-latest{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--white);margin-top:8px;}
  .history-latest span{font-size:10.5px;color:var(--gray);font-weight:400;margin-left:6px;}

  .tooltip{
    position:fixed;z-index:100;background:#151e34;border:1px solid #2b3856;border-radius:8px;
    padding:10px 13px;font-family:var(--mono);font-size:11px;min-width:190px;pointer-events:none;
    box-shadow:0 12px 30px rgba(0,0,0,0.6);display:none;
  }
  .tooltip .tt-name{font-size:12px;font-weight:700;margin-bottom:4px;color:#fff;}
  .tooltip .tt-ip{color:var(--amber);margin-bottom:2px;}
  .tooltip .tt-mac{color:var(--gray);font-size:10px;margin-bottom:6px;}
  .tooltip .tt-metric{display:flex;justify-content:space-between;gap:14px;color:#ccc;padding:1px 0;}
  .tooltip .tt-metric b{color:#fff;}
  .tooltip .tt-status{margin-top:6px;padding-top:6px;border-top:1px solid #2b3856;display:flex;align-items:center;gap:6px;}
  .tooltip .tt-status .sd{width:7px;height:7px;border-radius:50%;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:#070c18;}
  ::-webkit-scrollbar-thumb{background:#232f4b;border-radius:8px;}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="banner" id="banner">
  backend indisponível — inicie <code>python3 server.py</code> para status em tempo real.
</div>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">
      <div class="r1">rede</div>
      <div class="r2">vitória</div>
    </div>
    <div class="title-block">
      <h1 id="map-title">Mapa</h1>
      <div class="sub"><span class="conn-dot" id="conn-dot"></span><span id="conn-label">conectando ao backend...</span></div>
    </div>
  </div>
  <div class="stats">
    <div class="topbar-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Buscar dispositivo ou IP...">
    </div>
    <div class="stat"><div class="n ok" id="stat-up">–</div><div class="l">Online</div></div>
    <div class="stat"><div class="n bad" id="stat-down">–</div><div class="l">Offline</div></div>
    <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Total</div></div>
    <div class="clock"><div id="clock">--:--:--</div><div class="clock-date" id="clock-date">--/--/----</div></div>
    <div class="zoom-controls" id="font-scale-controls" title="Tamanho do texto dos dispositivos">
      <button id="font-scale-dec">A&#8595;</button>
      <button id="font-scale-reset-btn">A</button>
      <button id="font-scale-inc">A&#8593;</button>
    </div>
    <a href="/selecionar" class="config-link">&#8617; mapas</a>
    <a href="/config" class="config-link">&#9881; Config</a>
    <div class="config-link-stack">
      <a href="/dashboard" class="config-link">&#128202; Falhas</a>
      <a href="/logs" class="config-link">&#128220; Relatórios</a>
    </div>
    <button id="sound-toggle" class="config-link" title="Ativar/desativar aviso sonoro de falha">&#128266; Som</button>
    <div class="config-link-stack">
      <button id="lock-toggle" class="config-link" title="Destravar para reordenar os dispositivos dentro da categoria">&#128274; Bloqueado</button>
      <button id="save-positions-btn" class="config-link" style="display:none;background:var(--green);color:#062712;font-weight:700;" title="Salvar a nova ordem">&#128190; Salvar posições</button>
    </div>
    <a href="/logout" class="config-link">&#128274; Sair</a>
  </div>
</div>

<div class="history-panel" id="history-panel">
  <div class="history-head">
    <div class="h-name" id="history-name">Histórico (12h)</div>
    <button class="h-close" id="history-close" title="fechar">&times;</button>
  </div>
  <div id="history-body">
    <div class="history-empty">passe o mouse sobre um dispositivo<br>no mapa para ver o histórico</div>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const MAP_ID = window.location.pathname.split('/').filter(Boolean).pop();
let NET = null;
const POLL_MS = 30000;

const board = document.getElementById('board');
let liveStatus = {};
const deviceEls = {};

(function applyThemePreference(){
  const theme = localStorage.getItem('painel_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
(function applyFontScalePreference(){
  const saved = localStorage.getItem('painel_font_scale_' + MAP_ID);
  if(saved) document.documentElement.style.setProperty('--device-font-scale', saved);
})();

(function applyBoldPreference(){
  const bold = localStorage.getItem('painel_bold') === 'bold';
  if(bold){
    document.documentElement.style.setProperty('--device-name-weight', '900');
    document.documentElement.style.setProperty('--device-text-weight', '800');
  }
})();

// ---------------- controle de tamanho de fonte direto no mapa ----------------
(function setupFontScaleButtons(){
  const KEY = 'painel_font_scale_' + MAP_ID;
  function currentScale(){
    const saved = parseFloat(localStorage.getItem(KEY));
    return isNaN(saved) ? 1 : saved;
  }
  function applyScale(value){
    value = Math.max(0.7, Math.min(1.8, value));
    localStorage.setItem(KEY, value);
    document.documentElement.style.setProperty('--device-font-scale', value);
  }
  document.getElementById('font-scale-dec').addEventListener('click', () => applyScale(currentScale() - 0.1));
  document.getElementById('font-scale-inc').addEventListener('click', () => applyScale(currentScale() + 0.1));
  document.getElementById('font-scale-reset-btn').addEventListener('click', () => applyScale(1));
})();

function buildBoard(){
  board.innerHTML = '';
  const catOrder = NET.categories_order || Object.keys(NET.categories || {});
  const anyDevices = (NET.devices || []).length > 0;

  if(!anyDevices){
    board.innerHTML = '<div class="empty-map">Esse mapa ainda não tem dispositivos.<br><br>' +
      'Vá em <b>Configurações → Editor de Mapa</b> pra adicionar dispositivos e organizar este mapa.</div>';
    document.getElementById('stat-total').textContent = 0;
    return;
  }

  catOrder.forEach(cat => {
    const devs = (NET.categories && NET.categories[cat]) || [];
    if(devs.length === 0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const head = document.createElement('div');
    head.className = 'category-head';
    head.textContent = cat;
    catDiv.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'category-grid';

    devs.forEach(dev => {
      const a = document.createElement('a');
      a.className = 'device st-unknown';
      a.href = dev.ip ? ('http://' + dev.ip) : '#';
      a.target = '_blank';
      a.rel = 'noopener';
      a.dataset.id = dev.id;
      a.addEventListener('click', function(e){ e.preventDefault(); openDeviceWebpage(a.href, dev.name); });
      a.innerHTML = '<div class="dname">' + dev.name + '</div><div class="metrics-holder"><div class="no-metrics">aguardando...</div></div>';
      a.addEventListener('mouseenter', function(e){ showTooltip(e, dev); scheduleHistorySelect(dev); stopVoiceAlarm(dev.id); });
      a.addEventListener('mousemove', moveTooltip);
      a.addEventListener('mouseleave', function(){ hideTooltip(); cancelHistorySelect(); });
      grid.appendChild(a);
      deviceEls[dev.id] = a;
    });

    catDiv.appendChild(grid);
    board.appendChild(catDiv);
  });

  document.getElementById('stat-total').textContent = NET.devices.length;
}

const tooltip = document.getElementById('tooltip');
function showTooltip(e, dev){
  const st = liveStatus[dev.id];
  const macLine = (st && st.mac) ? '<div class="tt-mac">MAC: ' + st.mac + '</div>' : '';
  let html = '<div class="tt-name">' + dev.name + '</div><div class="tt-ip">' + (dev.ip || 'sem IP configurado') + '</div>' + macLine;
  if(dev.metrics && dev.metrics.length){
    dev.metrics.forEach(function(m){
      const me = st && st.metrics ? st.metrics[m.label] : null;
      const val = me && me.display ? me.display : (me && me.state==='error' ? 'sem leitura' : '—');
      const flag = me && me.state === 'alarm' ? ' <span style="color:var(--red, #e5384b);">&#9888;</span>' : '';
      html += '<div class="tt-metric"><span>' + m.label + '</span><b>' + val + flag + '</b></div>';
    });
  }
  const statusClass = st ? (st.reachable ? 'up' : 'down') : 'unknown';
  const statusText = st ? (st.reachable ? 'online' + (st.latency_ms!=null?' · '+st.latency_ms+'ms':'') : 'offline') : 'sem dados';
  const color = statusClass==='up' ? 'var(--green)' : statusClass==='down' ? 'var(--red)' : 'var(--gray)';
  html += '<div class="tt-status"><span class="sd" style="background:' + color + '"></span>' + statusText + '</div>';
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e){
  const pad = 16;
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x + 220 > window.innerWidth) x = e.clientX - 220 - pad;
  if(y + 160 > window.innerHeight) y = e.clientY - 160 - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip(){ tooltip.style.display = 'none'; }

let confirmedState = {};  // dev.id -> ultimo estado CONFIRMADO (true=ok/verde, false=queda/vermelho)
let badStreak = {};   // dev.id -> quantas leituras RUINS seguidas, sem confirmar ainda a queda
let goodStreak = {};   // dev.id -> quantas leituras BOAS seguidas, sem confirmar ainda a recuperacao
let SOUND_ALARM_CONFIRM_COUNT = 2; // valor padrao ate carregar a configuracao real do servidor -
                                       // evita alarme falso por um unico timeout de ping (comum
                                       // em enlaces de radio com latencia mais alta/variavel)

async function loadVisualConfirmConfig(){
  try{
    const res = await fetch('/api/alarm-confirm-config', {cache:'no-store'});
    const data = await res.json();
    if(data.visual_confirm_count) SOUND_ALARM_CONFIRM_COUNT = data.visual_confirm_count;
  }catch(e){ /* mantem o padrao se a busca falhar */ }
}

function applyStatus(){
  let up=0, down=0, active=0;
  (NET.devices || []).forEach(function(dev){
    const el = deviceEls[dev.id];
    if(!el) return;
    const st = liveStatus[dev.id];
    el.classList.remove('st-up','st-down','st-unknown','st-disabled');
    const holder = el.querySelector('.metrics-holder');

    if(st && st.disabled){
      el.classList.add('st-disabled');
      holder.innerHTML = '<div class="no-metrics">desativado</div>';
      return;
    }
    if(!st){
      el.classList.add('st-unknown');
      holder.innerHTML = '<div class="no-metrics">aguardando...</div>';
      return;
    }
    active++;

    let hasAlarm = false;
    let hiddenMetricHadData = false;
    let rows = '';
    if(dev.metrics && dev.metrics.length && st.metrics){
      dev.metrics.forEach(function(m){
        const me = st.metrics[m.label];
        if(!me) return;
        if(me.state === 'alarm'){
          hasAlarm = true;
          if(m.hide_on_map){ hiddenMetricHadData = true; }
          else rows += '<div class="metric-row metric-alarm">&#9888; ' + m.label + ': ' + me.display + '</div>';
        } else if(me.state === 'error'){
          if(m.hide_on_map){ hiddenMetricHadData = true; }
          else rows += '<div class="metric-row metric-error">' + m.label + ': ' + (dev.protocol==='modbus'?'MODBUS OFF':'SNMP OFF') + '</div>';
        } else if(me.display){
          if(m.hide_on_map){ hiddenMetricHadData = true; }
          else rows += '<div class="metric-row">' + m.label + ': ' + me.display + '</div>';
        }
      });
    }

    const boxOk = st.reachable && !hasAlarm;
    if(st.reachable) up++; else down++;

    if(boxOk){
      goodStreak[dev.id] = (goodStreak[dev.id] || 0) + 1;
      badStreak[dev.id] = 0;
    } else {
      badStreak[dev.id] = (badStreak[dev.id] || 0) + 1;
      goodStreak[dev.id] = 0;
    }

    if(badStreak[dev.id] === SOUND_ALARM_CONFIRM_COUNT && confirmedState[dev.id] !== false){
      confirmedState[dev.id] = false;
      if(dev.sound_enabled !== false){
        playAlertBeep();
        startVoiceAlarm(dev);
      }
    } else if(goodStreak[dev.id] === SOUND_ALARM_CONFIRM_COUNT && confirmedState[dev.id] !== true){
      confirmedState[dev.id] = true;
      stopVoiceAlarm(dev.id);
      playRecoveryBeep();
    }
    if(confirmedState[dev.id] === undefined) confirmedState[dev.id] = boxOk;

    el.classList.add(confirmedState[dev.id] ? 'st-up' : 'st-down');

    if(rows){
      holder.innerHTML = rows;
    } else if(hiddenMetricHadData){
      holder.innerHTML = st.reachable
        ? '<div class="metric-row">' + (st.latency_ms!=null ? st.latency_ms+' ms' : 'online') + '</div>'
        : '<div class="no-metrics">sem resposta</div>';
    } else if(dev.metrics && dev.metrics.length){

    }
  });
  document.getElementById('stat-up').textContent = up;
  document.getElementById('stat-down').textContent = down;
  document.getElementById('stat-total').textContent = active;
}

let selectedDevice = null;
let selectedSeriesKey = null;
let historyHoverTimer = null;
const HISTORY_HOVER_DELAY_MS = 250;

function scheduleHistorySelect(dev){
  clearTimeout(historyHoverTimer);
  historyHoverTimer = setTimeout(function(){ selectDeviceForHistory(dev); }, HISTORY_HOVER_DELAY_MS);
}
function cancelHistorySelect(){ clearTimeout(historyHoverTimer); }

function selectDeviceForHistory(dev){
  if(selectedDevice && selectedDevice.id === dev.id) return;
  selectedDevice = dev;
  const options = [];
  if(dev.metrics && dev.metrics.length){
    dev.metrics.forEach(m => options.push({key: m.label, label: m.label + (m.unit ? ' ('+m.unit+')' : '')}));
  }
  options.push({key: 'latency', label: 'Latência (ms)'});
  selectedSeriesKey = options[0].key;

  document.getElementById('history-name').textContent = dev.name;
  const body = document.getElementById('history-body');
  const ipLine = dev.ip ? '<div class="history-ip">' + dev.ip + '</div>' : '';
  const selectHtml = options.length > 1
    ? '<select class="history-select" id="history-select">' +
        options.map(o => '<option value="'+o.key+'">'+o.label+'</option>').join('') +
      '</select>'
    : '';
  body.innerHTML = ipLine + selectHtml +
    '<div class="history-gauge-wrap" id="history-gauge-wrap"></div>' +
    '<div class="history-chart-wrap" id="history-chart-wrap"><div class="history-empty">carregando histórico...</div></div>' +
    '<div class="history-latest" id="history-latest"></div>';

  const sel = document.getElementById('history-select');
  if(sel){
    sel.addEventListener('change', function(){ selectedSeriesKey = sel.value; refreshHistory(); });
  }
  refreshHistory();
}

document.getElementById('history-close').addEventListener('click', function(){
  selectedDevice = null;
  document.getElementById('history-name').textContent = 'Histórico (12h)';
  document.getElementById('history-body').innerHTML =
    '<div class="history-empty">passe o mouse sobre um dispositivo<br>no mapa para ver o histórico</div>';
});

async function refreshHistory(){
  if(!selectedDevice) return;
  try{
    const res = await fetch('/api/history?id=' + selectedDevice.id, {cache:'no-store'});
    if(!res.ok) throw new Error('bad');
    const data = await res.json();
    const series = selectedSeriesKey === 'latency'
      ? (data.latency || [])
      : ((data.metrics && data.metrics[selectedSeriesKey]) || []);
    renderHistoryChart(series);
  }catch(err){
    const wrap = document.getElementById('history-chart-wrap');
    if(wrap) wrap.innerHTML = '<div class="history-empty">sem conexão com o backend</div>';
  }
}

function isPowerMetric(label){
  const norm = (label || '').toLowerCase()
    .replace(/[áàâã]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i')
    .replace(/[óôõ]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'c');
  return norm.includes('potencia') || norm.includes('refletida');
}

function renderGauge(value, metricCfg, unit){
  const gaugeWrap = document.getElementById('history-gauge-wrap');
  if(!gaugeWrap) return;
  if(value == null || !isFinite(value)){
    gaugeWrap.classList.remove('show');
    gaugeWrap.innerHTML = '';
    return;
  }
  const cm = metricCfg ? metricCfg.compare_method : null;
  const cv = metricCfg ? metricCfg.compare_value : null;
  let divisor = metricCfg && metricCfg.divisor ? metricCfg.divisor : 1;
  const threshold = (cv != null) ? cv / divisor : null;
  let dangerAbove = true;
  if(cm === 5 || cm === 6) dangerAbove = false;
  let maxV;
  if(threshold != null){
    maxV = dangerAbove ? threshold * 1.4 : Math.max(threshold * 1.6, value * 1.2);
  } else {
    maxV = Math.max(value * 1.4, 10);
  }
  let minV = 0;
  if(value > maxV) maxV = value * 1.15;

  const cx = 100, cy = 88, r = 58, sw = 13;
  function angleFor(v){
    const frac = Math.max(0, Math.min(1, (v - minV) / (maxV - minV)));
    return 180 - frac * 180;
  }
  function pointAt(angleDeg, radius){
    const rad = angleDeg * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy - radius * Math.sin(rad) };
  }
  function arcPath(a1, a2, radius){
    const p1 = pointAt(a1, radius), p2 = pointAt(a2, radius);
    const largeArc = Math.abs(a1 - a2) > 180 ? 1 : 0;
    return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
           ' A ' + radius + ' ' + radius + ' 0 ' + largeArc + ' 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  const isDanger = (threshold != null) && (dangerAbove ? value > threshold : value < threshold);
  const fillColor = isDanger ? '#e5384b' : '#35a7f5';
  const valueAngle = angleFor(value);
  const bgArc = '<path d="' + arcPath(180, 0, r) + '" stroke="#232f4b" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>';
  const progressArc = '<path d="' + arcPath(180, valueAngle, r) + '" stroke="'+fillColor+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>';
  let marker = '';
  if(threshold != null && threshold > minV && threshold < maxV){
    const mAngle = angleFor(threshold);
    const p1 = pointAt(mAngle, r - sw*0.9);
    const p2 = pointAt(mAngle, r + sw*0.9);
    marker = '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="var(--amber)" stroke-width="2.5"/>';
  }
  const minLabel = pointAt(180, r + 14);
  const maxLabel = pointAt(0, r + 14);
  const displayVal = (value % 1 === 0) ? value.toFixed(0) : value.toFixed(2);
  gaugeWrap.innerHTML =
    '<svg viewBox="0 0 200 100">' + bgArc + progressArc + marker +
      '<text class="gauge-label-text" x="'+minLabel.x.toFixed(1)+'" y="'+(minLabel.y).toFixed(1)+'" text-anchor="start" font-size="9">' + minV.toFixed(0) + '</text>' +
      '<text class="gauge-label-text" x="'+maxLabel.x.toFixed(1)+'" y="'+(maxLabel.y).toFixed(1)+'" text-anchor="end" font-size="9">' + maxV.toFixed(0) + '</text>' +
      '<text class="gauge-value-text" x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="21" fill="var(--white)">' + displayVal + '<tspan font-size="11" fill="var(--gray)" dx="3">' + (unit||'') + '</tspan></text>' +
    '</svg>';
  gaugeWrap.classList.add('show');
}

function renderHistoryChart(series){
  const wrap = document.getElementById('history-chart-wrap');
  const latestEl = document.getElementById('history-latest');
  if(!wrap) return;
  if(!series || series.length < 2){
    wrap.innerHTML = '<div class="history-empty">ainda sem dados suficientes<br>(aguardando leituras)</div>';
    if(latestEl) latestEl.textContent = '';
    const gaugeWrap = document.getElementById('history-gauge-wrap');
    if(gaugeWrap){ gaugeWrap.classList.remove('show'); gaugeWrap.innerHTML=''; }
    return;
  }
  const now = Date.now()/1000;
  const windowStart = now - 12*3600;
  const pts = series.filter(p => p[0] >= windowStart);
  if(pts.length < 2){
    wrap.innerHTML = '<div class="history-empty">ainda sem dados suficientes<br>(aguardando leituras)</div>';
    if(latestEl) latestEl.textContent = '';
    return;
  }
  const W = 288, H = 120, PAD_L = 34, PAD_B = 16, PAD_T = 6, PAD_R = 4;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  const values = pts.map(p => p[1]);
  let minV = Math.min(...values), maxV = Math.max(...values);
  if(minV === maxV){ minV -= 1; maxV += 1; }
  const rangePad = (maxV - minV) * 0.1;
  minV -= rangePad; maxV += rangePad;
  function xFor(ts){ return PAD_L + ((ts - windowStart) / (now - windowStart)) * plotW; }
  function yFor(v){ return PAD_T + (1 - (v - minV)/(maxV - minV)) * plotH; }
  let d = 'M ' + xFor(pts[0][0]).toFixed(1) + ' ' + yFor(pts[0][1]).toFixed(1);
  for(let i=1;i<pts.length;i++){ d += ' L ' + xFor(pts[i][0]).toFixed(1) + ' ' + yFor(pts[i][1]).toFixed(1); }
  const areaD = d + ' L ' + xFor(pts[pts.length-1][0]).toFixed(1) + ' ' + (PAD_T+plotH) +
                ' L ' + xFor(pts[0][0]).toFixed(1) + ' ' + (PAD_T+plotH) + ' Z';
  const gridLines = [0,0.5,1].map(f => {
    const y = PAD_T + f*plotH;
    const val = maxV - f*(maxV-minV);
    return '<line x1="'+PAD_L+'" y1="'+y+'" x2="'+(W-PAD_R)+'" y2="'+y+'"/>' +
           '<text class="history-axis-label" x="2" y="'+(y+3)+'">'+val.toFixed(val<10?1:0)+'</text>';
  }).join('');
  const timeLabels = ['-12h','-6h','agora'].map((lbl,i) => {
    const x = PAD_L + (i/2)*plotW;
    const anchor = i===0 ? 'start' : (i===2 ? 'end' : 'middle');
    return '<text class="history-axis-label" x="'+x+'" y="'+(H-2)+'" text-anchor="'+anchor+'">'+lbl+'</text>';
  }).join('');
  wrap.innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'">' +
      '<defs><linearGradient id="historyGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#2ecc55" stop-opacity="0.5"/>' +
        '<stop offset="100%" stop-color="#2ecc55" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<g class="history-grid">'+gridLines+'</g>' +
      '<path class="history-area" d="'+areaD+'"></path>' +
      '<path class="history-line" d="'+d+'"></path>' + timeLabels +
    '</svg>';
  const last = pts[pts.length-1][1];
  if(latestEl) latestEl.innerHTML = last.toFixed(last % 1 === 0 ? 0 : 2) + '<span>último valor</span>';

  if(isPowerMetric(selectedSeriesKey) && selectedDevice){
    const metricCfg = (selectedDevice.metrics || []).find(m => m.label === selectedSeriesKey);
    renderGauge(last, metricCfg, metricCfg ? metricCfg.unit : '');
  } else {
    const gaugeWrap = document.getElementById('history-gauge-wrap');
    if(gaugeWrap){ gaugeWrap.classList.remove('show'); gaugeWrap.innerHTML=''; }
  }
}

const HISTORY_GEOM_KEY = 'painel_history_geom_' + MAP_ID;
function saveHistoryGeom(){
  const panel = document.getElementById('history-panel');
  const rect = panel.getBoundingClientRect();
  localStorage.setItem(HISTORY_GEOM_KEY, JSON.stringify({left: rect.left, top: rect.top, width: rect.width, height: rect.height}));
}
function restoreHistoryGeom(){
  const panel = document.getElementById('history-panel');
  const saved = localStorage.getItem(HISTORY_GEOM_KEY);
  if(!saved) return;
  try{
    const g = JSON.parse(saved);
    panel.style.left = g.left + 'px'; panel.style.top = g.top + 'px'; panel.style.right = 'auto';
    panel.style.width = g.width + 'px'; panel.style.height = g.height + 'px';
    panel.dataset.userMoved = '1';
  }catch(e){}
}
(function setupHistoryPanelDragResize(){
  const panel = document.getElementById('history-panel');
  const head = panel.querySelector('.history-head');
  let dragging = false, offsetX = 0, offsetY = 0;
  head.addEventListener('mousedown', function(e){
    if(e.target.closest('.h-close')) return;
    dragging = true;
    const rect = panel.getBoundingClientRect();
    offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    const maxLeft = window.innerWidth - 60, maxTop = window.innerHeight - 40;
    const newLeft = Math.min(maxLeft, Math.max(0, e.clientX - offsetX));
    const newTop = Math.min(maxTop, Math.max(0, e.clientY - offsetY));
    panel.style.left = newLeft + 'px'; panel.style.top = newTop + 'px'; panel.style.right = 'auto';
    panel.dataset.userMoved = '1';
  });
  document.addEventListener('mouseup', function(){ if(dragging){ dragging = false; saveHistoryGeom(); } });
  if(typeof ResizeObserver !== 'undefined'){
    const ro = new ResizeObserver(function(){ if(panel.dataset.userMoved) saveHistoryGeom(); });
    ro.observe(panel);
  }
  restoreHistoryGeom();
})();

function positionFloatingPanels(){
  const topbar = document.querySelector('.topbar');
  if(!topbar) return;
  const bottom = topbar.getBoundingClientRect().bottom;
  const historyPanel = document.getElementById('history-panel');
  if(historyPanel && !historyPanel.dataset.userMoved) historyPanel.style.top = (bottom + 12) + 'px';
}

function openDeviceWebpage(url, deviceName){
  if(!url || url === '#') return;
  const msg = deviceName ? 'Abrir a página web de "' + deviceName + '"?' : 'Abrir a página web deste dispositivo?';
  if(!confirm(msg)) return;
  // forca a janela nova a abrir ancorada em (0,0) - na grande maioria das
  // configuracoes do Windows com varios monitores, o monitor PRINCIPAL
  // comeca em (0,0) e os secundarios ficam posicionados antes/depois dele.
  // Isso evita que a janela abra "perdida" num monitor secundario.
  const w = window.open(url, '_blank', 'left=0,top=0,width=1360,height=860');
  if(w){ try{ w.focus(); }catch(e){} }
}

function playAlertBeep(){
  if(!soundEnabled) return;
  try{
    if(!alarmAudioEl){
      alarmAudioEl = new Audio(ALARM_SOUND_DATA_URI);
    }
    alarmAudioEl.currentTime = 0;
    alarmAudioEl.play().catch(function(){});
  }catch(e){}
}
function playRecoveryBeep(){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    [[0, 660], [0.11, 990]].forEach(function(pair){
      const offset = pair[0], freq = pair[1];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.22, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.14);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.15);
    });
  }catch(e){}
}

let mapUnlocked = false;
let dragEl = null;

function updateLockButton(){
  const btn = document.getElementById('lock-toggle');
  btn.innerHTML = mapUnlocked ? '&#128275; Destravado' : '&#128274; Bloqueado';
  btn.classList.toggle('muted', mapUnlocked);
  document.getElementById('save-positions-btn').style.display = mapUnlocked ? 'inline-block' : 'none';
}

function attachReorderHandlers(){
  document.querySelectorAll('.category-grid .device').forEach(el => {
    el.draggable = true;
    el.setAttribute('draggable', 'true');
    el.style.cursor = 'grab';
    el.style.webkitUserDrag = 'element';
  });
}
function detachReorderHandlers(){
  document.querySelectorAll('.category-grid .device').forEach(el => {
    el.draggable = false;
    el.style.cursor = '';
  });
}

document.addEventListener('dragstart', function(e){
  if(!mapUnlocked) return;
  const el = e.target.closest('.category-grid .device');
  if(!el) return;
  dragEl = el;
  el.classList.add('dragging-active');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(el.dataset.id || '')); }catch(err){}
});
function getClosestDeviceInGrid(grid, clientX, clientY, excludeEl){
  const items = Array.from(grid.querySelectorAll('.device')).filter(el => el !== excludeEl);
  let closestEl = null, closestDist = Infinity, closestBefore = true;
  items.forEach(el => {
    const rect = el.getBoundingClientRect();
    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);
    if(dist < closestDist){
      closestDist = dist;
      closestEl = el;
      const sameRow = Math.abs(clientY - centerY) < rect.height * 0.6;
      closestBefore = sameRow ? (clientX < centerX) : (clientY < centerY);
    }
  });
  return {el: closestEl, before: closestBefore};
}

document.addEventListener('dragover', function(e){
  if(!mapUnlocked || !dragEl) return;
  const grid = e.target.closest('.category-grid');
  if(!grid || !grid.contains(dragEl)) return;
  e.preventDefault();
  const result = getClosestDeviceInGrid(grid, e.clientX, e.clientY, dragEl);
  if(!result.el) return;
  grid.insertBefore(dragEl, result.before ? result.el : result.el.nextSibling);
});
document.addEventListener('dragend', function(e){
  if(e.target.classList) e.target.classList.remove('dragging-active');
  dragEl = null;
});

document.getElementById('lock-toggle').addEventListener('click', function(){
  mapUnlocked = !mapUnlocked;
  updateLockButton();
  if(mapUnlocked) attachReorderHandlers(); else detachReorderHandlers();
});
updateLockButton();

document.getElementById('save-positions-btn').addEventListener('click', async function(){
  const btn = this;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'salvando...';
  try{
    const positions = {};
    document.querySelectorAll('.category-grid').forEach(grid => {
      Array.from(grid.querySelectorAll('.device')).forEach((el, idx) => {
        positions[el.dataset.id] = {x: 0, y: idx * 100, scale: 1};
      });
    });
    const res = await fetch('/api/layout/' + MAP_ID, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({devices: positions, labels: [], edges: []})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'falha ao salvar');
    btn.textContent = 'salvo ✓';
    setTimeout(() => { btn.textContent = originalText; }, 1500);
  }catch(err){
    alert('Erro ao salvar posições: ' + err.message);
    btn.textContent = originalText;
  }finally{
    btn.disabled = false;
  }
});

const VOICE_REPEAT_MS = 60000;
const VOICE_MAX_TIMES = 10;
let activeVoiceAlarms = {};
function speakAlarm(deviceName){
  if(!soundEnabled) return;
  if(!('speechSynthesis' in window)) return;
  try{
    const utter = new SpeechSynthesisUtterance('Alarme ' + deviceName);
    utter.lang = 'pt-BR'; utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}
function startVoiceAlarm(dev){
  stopVoiceAlarm(dev.id);
  let count = 0;
  const fire = function(){ speakAlarm(dev.name); count++; if(count >= VOICE_MAX_TIMES) stopVoiceAlarm(dev.id); };
  fire();
  const intervalId = setInterval(fire, VOICE_REPEAT_MS);
  activeVoiceAlarms[dev.id] = { count: count, intervalId: intervalId };
}
function stopVoiceAlarm(devId){
  const entry = activeVoiceAlarms[devId];
  if(entry){ clearInterval(entry.intervalId); delete activeVoiceAlarms[devId]; }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

// ---------------- polling ----------------
async function pollStatus(){
  try{
    const res = await fetch('/api/status', {cache:'no-store'});
    if(res.status === 401){ window.location.href = '/login'; return; }
    if(!res.ok) throw new Error('bad');
    const data = await res.json();
    liveStatus = data.devices || {};
    document.getElementById('banner').classList.remove('show');
    document.getElementById('conn-dot').className = 'conn-dot live';
    document.getElementById('conn-label').textContent = 'backend conectado · atualiza a cada ' + Math.round(data.refresh_interval||8) + 's';
    applyStatus();
    if(selectedDevice) refreshHistory();
  }catch(err){
    document.getElementById('banner').classList.add('show');
    document.getElementById('conn-dot').className = 'conn-dot down';
    document.getElementById('conn-label').textContent = 'backend offline';
  }
}

async function applyCustomOrder(){
  // mesma logica do Mapa FG: a ordem vertical organizada no mapa (arrastar
  // com o cadeado destravado) reordena os dispositivos dentro de cada
  // categoria - o grid fluido se ajusta sozinho, entao nao usamos posicao
  // em pixel exata, so a ordem relativa.
  try{
    const res = await fetch('/api/layout/' + MAP_ID, {cache:'no-store'});
    if(!res.ok) return;
    const layout = await res.json();
    if(!layout || !layout.devices || Object.keys(layout.devices).length === 0) return;

    Object.keys(NET.categories || {}).forEach(cat => {
      const devs = NET.categories[cat];
      devs.sort((a, b) => {
        const pa = layout.devices[a.id] || layout.devices[String(a.id)];
        const pb = layout.devices[b.id] || layout.devices[String(b.id)];
        if(pa && pb) return pa.y - pb.y;
        if(pa && !pb) return -1;
        if(!pa && pb) return 1;
        return 0;
      });
    });
  }catch(e){ /* sem layout customizado ainda, ou falha ao buscar */ }
}

async function init(){
  await loadVisualConfirmConfig();
  let res;
  try{
    res = await fetch('/api/map-devices/' + MAP_ID, {cache:'no-store'});
  }catch(err){
    document.getElementById('banner').classList.add('show');
    document.getElementById('banner').textContent = 'nao foi possivel conectar ao backend. Verifique se o server.py esta rodando.';
    return;
  }
  if(res.status === 401){ window.location.href = '/login'; return; }
  if(!res.ok){
    document.getElementById('banner').classList.add('show');
    document.getElementById('banner').textContent = 'erro ao carregar dispositivos (status ' + res.status + ').';
    return;
  }
  NET = await res.json();
  document.getElementById('map-title').textContent = NET.map_name || 'Mapa';
  document.title = (NET.map_name || 'Mapa') + ' — Rede Gazeta';

  await applyCustomOrder();
  buildBoard();
  positionFloatingPanels();
  pollStatus();
  setInterval(pollStatus, POLL_MS);
}
init();
</script>
</body>
</html>
